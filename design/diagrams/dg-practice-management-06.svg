<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 456" role="img" style="display:block;width:100%;height:auto;font-family:'Source Sans 3',system-ui,sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#4B2A85"></path></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#B8952E"></path></marker></defs>
<text x="30" y="26" font-size="12.5" letter-spacing="1.6" fill="#6B6478">PRACTICE MANAGEMENT · SECTION 1.10</text><line x1="30" y1="40" x2="930" y2="40" stroke="#B8952E" stroke-width="1"></line>
<rect x="30" y="70" width="170" height="58" rx="4" fill="#FFFFFF" stroke="#4B2A85" stroke-width="1.3"></rect><text x="42" y="104" font-size="13.5" fill="#1F1A26" font-weight="600">WIP</text><rect x="230" y="70" width="170" height="58" rx="4" fill="#FFFFFF" stroke="#4B2A85" stroke-width="1.3"></rect><text x="242" y="104" font-size="13.5" fill="#1F1A26" font-weight="600">Fees rendered</text><rect x="430" y="70" width="170" height="58" rx="4" fill="#FFFFFF" stroke="#4B2A85" stroke-width="1.3"></rect><text x="442" y="104" font-size="13.5" fill="#1F1A26" font-weight="600">Debtors</text><rect x="630" y="70" width="300" height="58" rx="4" fill="#EAE3F4" stroke="#4B2A85" stroke-width="1.3"></rect><text x="642" y="104" font-size="15" fill="#1F1A26" font-weight="600">Bank account</text><line x1="200" y1="99" x2="228" y2="99" stroke="#4B2A85" marker-end="url(#a)"></line><line x1="400" y1="99" x2="428" y2="99" stroke="#4B2A85" marker-end="url(#a)"></line><line x1="600" y1="99" x2="628" y2="99" stroke="#4B2A85" marker-end="url(#a)"></line><rect x="30" y="148" width="170" height="55" rx="3" fill="#FFFFFF" stroke="#4B2A85" stroke-dasharray="4 3"></rect><text x="42" y="168" font-size="11" letter-spacing="1.1" font-weight="700" fill="#4B2A85">LOCK-UP</text><text x="42" y="186" font-size="12" fill="#1F1A26">work done but not billed</text><rect x="230" y="148" width="170" height="70" rx="3" fill="#FFFFFF" stroke="#D98C8C" stroke-dasharray="4 3"></rect><text x="242" y="168" font-size="11" letter-spacing="1.1" font-weight="700" fill="#D98C8C">LOSS</text><text x="242" y="186" font-size="12" fill="#1F1A26">write-downs between WIP</text><text x="242" y="201" font-size="12" fill="#1F1A26">and the bill</text><rect x="430" y="148" width="170" height="55" rx="3" fill="#FFFFFF" stroke="#4B2A85" stroke-dasharray="4 3"></rect><text x="442" y="168" font-size="11" letter-spacing="1.1" font-weight="700" fill="#4B2A85">LOCK-UP</text><text x="442" y="186" font-size="12" fill="#1F1A26">billed but not collected</text><rect x="30" y="240" width="170" height="70" rx="3" fill="#FFFFFF" stroke="#B8952E" stroke-dasharray="4 3"></rect><text x="42" y="260" font-size="11" letter-spacing="1.1" font-weight="700" fill="#B8952E">LEAK</text><text x="42" y="278" font-size="12" fill="#1F1A26">work done but never</text><text x="42" y="293" font-size="12" fill="#1F1A26">recorded (chargeable time)</text><rect x="230" y="240" width="170" height="70" rx="3" fill="#FFFFFF" stroke="#D98C8C" stroke-dasharray="4 3"></rect><text x="242" y="260" font-size="11" letter-spacing="1.1" font-weight="700" fill="#D98C8C">LOSS</text><text x="242" y="278" font-size="12" fill="#1F1A26">billed, never collected</text><text x="242" y="293" font-size="12" fill="#1F1A26">(bad debts)</text><rect x="430" y="240" width="170" height="70" rx="3" fill="#FFFFFF" stroke="#D98C8C" stroke-dasharray="4 3"></rect><text x="442" y="260" font-size="11" letter-spacing="1.1" font-weight="700" fill="#D98C8C">LOSS</text><text x="442" y="278" font-size="12" fill="#1F1A26">paid out, never recovered</text><text x="442" y="293" font-size="12" fill="#1F1A26">(disbursements)</text><text x="630" y="168" font-size="11.5" letter-spacing="1.2" fill="#6B6478">FUNDS COME IN FROM</text><rect x="630" y="180" width="148" height="44" rx="4" fill="#F4F1F8" stroke="#E3DEEA" stroke-width="1.3"></rect><text x="642" y="207" font-size="13.5" fill="#1F1A26" font-weight="600">Owners</text><rect x="782" y="180" width="148" height="44" rx="4" fill="#F4F1F8" stroke="#E3DEEA" stroke-width="1.3"></rect><text x="794" y="207" font-size="13.5" fill="#1F1A26" font-weight="600">Loans</text><text x="630" y="256" font-size="11.5" letter-spacing="1.2" fill="#6B6478">MONEY GOES OUT TO</text><rect x="630" y="268" width="148" height="44" rx="4" fill="#F4F1F8" stroke="#E3DEEA" stroke-width="1.3"></rect><text x="642" y="295" font-size="12.5" fill="#1F1A26" font-weight="600">Equipment</text><rect x="782" y="268" width="148" height="44" rx="4" fill="#F4F1F8" stroke="#E3DEEA" stroke-width="1.3"></rect><text x="794" y="295" font-size="12.5" fill="#1F1A26" font-weight="600">Drawings</text><rect x="630" y="322" width="148" height="44" rx="4" fill="#F4F1F8" stroke="#E3DEEA" stroke-width="1.3"></rect><text x="642" y="349" font-size="12.5" fill="#1F1A26" font-weight="600">Salaries and</text><text x="642" y="365" font-size="12.5" fill="#1F1A26" font-weight="600">overheads</text><rect x="782" y="322" width="148" height="44" rx="4" fill="#F4F1F8" stroke="#E3DEEA" stroke-width="1.3"></rect><text x="794" y="349" font-size="12.5" fill="#1F1A26" font-weight="600">Tax</text><line x1="782" y1="354" x2="782" y2="376" stroke="#4B2A85" marker-end="url(#a)"></line><line x1="30" y1="400" x2="930" y2="400" stroke="#B8952E"></line><text x="30" y="426" font-size="14" fill="#1F1A26" font-weight="600">The controls: capture all time; bill frequently; keep WIP under 40 days of production equivalent; chase slow payers; and</text><text x="30" y="444" font-size="14" fill="#1F1A26" font-weight="600">understand that file velocity matters more than file volume.</text></svg>