<text x="30" y="26" font-size="12.5" letter-spacing="1.6" fill="#6B6478">TRUST ACCOUNTING · SECTION 7.4</text><line x1="30" y1="40" x2="930" y2="40" stroke="#B8952E" stroke-width="1"></line>
<rect x="30" y="70" width="300" height="64" rx="4" fill="#FFFFFF" stroke="#4B2A85" stroke-width="1.3"></rect><text x="44" y="98" font-size="15" fill="#4B2A85" font-weight="700">Authorised signatory</text><text x="44" y="120" font-size="12" font-weight="600" fill="#6B6478">r 43(2)</text><line x1="180" y1="134" x2="180" y2="158" stroke="#4B2A85" marker-end="url(#a)"></line><rect x="30" y="162" width="300" height="150" rx="4" fill="#EAE3F4" stroke="#4B2A85"></rect><text x="44" y="190" font-size="15" fill="#4B2A85" font-weight="700">Cheque</text><text x="44" y="212" font-size="13" fill="#1F1A26">crossed &#34;not negotiable&#34;, specified</text><text x="44" y="229" font-size="13" fill="#1F1A26">payee, practice name and &#34;law</text><text x="44" y="246" font-size="13" fill="#1F1A26">practice trust account&#34;</text><rect x="360" y="162" width="270" height="150" rx="4" fill="#EAE3F4" stroke="#4B2A85"></rect><text x="374" y="190" font-size="15" fill="#4B2A85" font-weight="700">EFT</text><text x="374" y="212" font-size="13" fill="#1F1A26">internal reference, confirmation</text><text x="374" y="229" font-size="13" fill="#1F1A26">printed</text><line x1="330" y1="118" x2="495" y2="158" stroke="#4B2A85" marker-end="url(#a)"></line><line x1="180" y1="312" x2="180" y2="336" stroke="#4B2A85" marker-end="url(#a)"></line><line x1="495" y1="312" x2="300" y2="336" stroke="#4B2A85" marker-end="url(#a)"></line><rect x="30" y="340" width="600" height="58" rx="4" fill="#FFFFFF" stroke="#4B2A85" stroke-width="1.3"></rect><text x="44" y="366" font-size="15" font-weight="700" fill="#4B2A85">Written payment record</text><text x="44" y="386" font-size="12" font-weight="600" fill="#6B6478">r 43(3)</text><line x1="180" y1="398" x2="180" y2="418" stroke="#4B2A85" marker-end="url(#a)"></line><rect x="30" y="418" width="600" height="58" rx="4" fill="#FFFFFF" stroke="#4B2A85" stroke-width="1.3"></rect><text x="44" y="444" font-size="15" font-weight="700" fill="#4B2A85">Payments cash book</text><text x="44" y="464" font-size="12" font-weight="600" fill="#6B6478">r 45 · within 5 working days</text><line x1="180" y1="476" x2="180" y2="496" stroke="#4B2A85" marker-end="url(#a)"></line><rect x="30" y="496" width="600" height="58" rx="4" fill="#FFFFFF" stroke="#4B2A85" stroke-width="1.3"></rect><text x="44" y="522" font-size="15" font-weight="700" fill="#4B2A85">Trust ledger debit</text><text x="44" y="542" font-size="12" font-weight="600" fill="#6B6478">r 47</text><rect x="660" y="70" width="270" height="220" rx="4" fill="#FCEBEB" stroke="#D98C8C" stroke-width="1.6"></rect><text x="676" y="102" font-size="15" fill="#1F1A26" font-weight="700">Only two methods: cheque or</text><text x="676" y="122" font-size="15" fill="#1F1A26" font-weight="700">electronic funds transfer.</text><text x="676" y="172" font-size="13" fill="#1F1A26">No cash withdrawals, no ATM</text><text x="676" y="189" font-size="13" fill="#1F1A26">withdrawals or transfers, no</text><text x="676" y="206" font-size="13" fill="#1F1A26">telephone withdrawals or</text><text x="676" y="223" font-size="13" fill="#1F1A26">transfers. Civil penalty 50</text><text x="676" y="240" font-size="13" fill="#1F1A26">penalty units.</text></svg>