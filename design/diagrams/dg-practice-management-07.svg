<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 310" role="img" style="display:block;width:100%;height:auto;font-family:'Source Sans 3',system-ui,sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#4B2A85"></path></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#B8952E"></path></marker></defs>
<text x="30" y="26" font-size="12.5" letter-spacing="1.6" fill="#6B6478">PRACTICE MANAGEMENT · SECTION 1.11 · THE REASON, AND HOW IT SOUNDS</text><line x1="30" y1="40" x2="930" y2="40" stroke="#B8952E" stroke-width="1"></line>
<rect x="30" y="66" width="216" height="180" rx="4" fill="#FFFFFF" stroke="#E3DEEA"></rect><rect x="30" y="66" width="216" height="4" fill="#4B2A85"></rect><text x="46" y="100" font-size="15" fill="#4B2A85" font-weight="700">No urgency</text><circle cx="50" cy="126" r="2.5" fill="#B8952E"></circle><text x="62" y="130" font-size="12.5" fill="#1F1A26">The problem is absorbable.</text><text x="62" y="146" font-size="12.5" fill="#1F1A26">The solutions are</text><text x="62" y="162" font-size="12.5" fill="#1F1A26">uncomfortable</text><rect x="258" y="66" width="216" height="180" rx="4" fill="#FFFFFF" stroke="#E3DEEA"></rect><rect x="258" y="66" width="216" height="4" fill="#4B2A85"></rect><text x="274" y="100" font-size="15" fill="#4B2A85" font-weight="700">Inertia</text><circle cx="278" cy="126" r="2.5" fill="#B8952E"></circle><text x="290" y="130" font-size="12.5" fill="#1F1A26">The larger the firm the</text><text x="290" y="146" font-size="12.5" fill="#1F1A26">greater the inertia. It is</text><text x="290" y="162" font-size="12.5" fill="#1F1A26">all a bit too hard</text><rect x="486" y="66" width="216" height="180" rx="4" fill="#FFFFFF" stroke="#E3DEEA"></rect><rect x="486" y="66" width="216" height="4" fill="#4B2A85"></rect><text x="502" y="100" font-size="15" fill="#4B2A85" font-weight="700">Lack of ownership</text><circle cx="506" cy="126" r="2.5" fill="#B8952E"></circle><text x="518" y="130" font-size="12.5" fill="#1F1A26">I am fine, others are the</text><text x="518" y="146" font-size="12.5" fill="#1F1A26">problem. Find someone</text><text x="518" y="162" font-size="12.5" fill="#1F1A26">performing worse and point</text><rect x="714" y="66" width="216" height="180" rx="4" fill="#FFFFFF" stroke="#E3DEEA"></rect><rect x="714" y="66" width="216" height="4" fill="#4B2A85"></rect><text x="730" y="100" font-size="15" fill="#4B2A85" font-weight="700">Easier to wait it out</text><circle cx="734" cy="126" r="2.5" fill="#B8952E"></circle><text x="746" y="130" font-size="12.5" fill="#1F1A26">It has turned around</text><text x="746" y="146" font-size="12.5" fill="#1F1A26">before. Keep my head down</text><text x="30" y="276" font-size="13.5" fill="#1F1A26" font-weight="600">Worth knowing, because you will meet all four in any partnership.</text></svg>