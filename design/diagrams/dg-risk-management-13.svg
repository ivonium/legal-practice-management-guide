<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 1106" role="img" style="display:block;width:100%;height:auto;font-family:'Source Sans 3',system-ui,sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#4B2A85"></path></marker></defs>
<text x="30" y="26" font-size="12.5" letter-spacing="1.6" fill="#6B6478">RISK MANAGEMENT · SECTION 10.4</text><line x1="30" y1="40" x2="930" y2="40" stroke="#B8952E" stroke-width="1"></line>
<rect x="56" y="66" width="874" height="110" rx="4" fill="#FFFFFF" stroke="#E3DEEA"></rect><rect x="56" y="66" width="3" height="110" fill="#4B2A85"></rect><circle cx="56" cy="90" r="12" fill="#4B2A85"></circle><text x="56" y="95" text-anchor="middle" font-size="12" font-weight="700" fill="#FFFFFF">1</text><text x="78" y="92" font-size="14.5" fill="#4B2A85" font-weight="700">Risk based assessment</text><text x="78" y="112" font-size="13" fill="#1F1A26">Undertake a thorough assessment of your practice information security requirements. Take steps</text><text x="78" y="129" font-size="13" fill="#1F1A26">to make information and cyber security part of your normal business risk management procedures.</text><text x="78" y="146" font-size="13" fill="#1F1A26">Train and educate staff in cyber security principles so they become part of your practice</text><text x="78" y="163" font-size="13" fill="#1F1A26">culture</text><line x1="56" y1="176" x2="56" y2="186" stroke="#4B2A85"></line><rect x="56" y="186" width="874" height="93" rx="4" fill="#FFFFFF" stroke="#E3DEEA"></rect><rect x="56" y="186" width="3" height="93" fill="#4B2A85"></rect><circle cx="56" cy="210" r="12" fill="#4B2A85"></circle><text x="56" y="215" text-anchor="middle" font-size="12" font-weight="700" fill="#FFFFFF">2</text><text x="78" y="212" font-size="14.5" fill="#4B2A85" font-weight="700">Asset audit</text><text x="78" y="232" font-size="13" fill="#1F1A26">Your practice is only secure if everything is protected. Audit any assets potentially at risk -</text><text x="78" y="249" font-size="13" fill="#1F1A26">identify financial, personal and other information assets that are critical, and the IT services</text><text x="78" y="266" font-size="13" fill="#1F1A26">you rely on</text><line x1="56" y1="279" x2="56" y2="289" stroke="#4B2A85"></line><rect x="56" y="289" width="874" height="93" rx="4" fill="#FFFFFF" stroke="#E3DEEA"></rect><rect x="56" y="289" width="3" height="93" fill="#4B2A85"></rect><circle cx="56" cy="313" r="12" fill="#4B2A85"></circle><text x="56" y="318" text-anchor="middle" font-size="12" font-weight="700" fill="#FFFFFF">3</text><text x="78" y="315" font-size="14.5" fill="#4B2A85" font-weight="700">Vulnerability assessment</text><text x="78" y="335" font-size="13" fill="#1F1A26">Assess your cyber security resilience and identify where you may have vulnerabilities. Assess</text><text x="78" y="352" font-size="13" fill="#1F1A26">all the IT equipment within your practice, including mobile and personal IT devices. Understand</text><text x="78" y="369" font-size="13" fill="#1F1A26">the technical and organisational risks and how they are currently managed</text><line x1="56" y1="382" x2="56" y2="392" stroke="#4B2A85"></line><rect x="56" y="392" width="874" height="93" rx="4" fill="#FFFFFF" stroke="#E3DEEA"></rect><rect x="56" y="392" width="3" height="93" fill="#4B2A85"></rect><circle cx="56" cy="416" r="12" fill="#4B2A85"></circle><text x="56" y="421" text-anchor="middle" font-size="12" font-weight="700" fill="#FFFFFF">4</text><text x="78" y="418" font-size="14.5" fill="#4B2A85" font-weight="700">Expert advice</text><text x="78" y="438" font-size="13" fill="#1F1A26">Decide whether you need expert advice to undertake risk and vulnerability assessments and to get</text><text x="78" y="455" font-size="13" fill="#1F1A26">the right protection and security controls in place, regardless of whether your IT is outsourced</text><text x="78" y="472" font-size="13" fill="#1F1A26">or in-house</text><line x1="56" y1="485" x2="56" y2="495" stroke="#4B2A85"></line><rect x="56" y="495" width="874" height="93" rx="4" fill="#FFFFFF" stroke="#E3DEEA"></rect><rect x="56" y="495" width="3" height="93" fill="#4B2A85"></rect><circle cx="56" cy="519" r="12" fill="#4B2A85"></circle><text x="56" y="524" text-anchor="middle" font-size="12" font-weight="700" fill="#FFFFFF">5</text><text x="78" y="521" font-size="14.5" fill="#4B2A85" font-weight="700">Risk framework and governance</text><text x="78" y="541" font-size="13" fill="#1F1A26">Put technical and practice measures in place to satisfy the security obligations relating to</text><text x="78" y="558" font-size="13" fill="#1F1A26">personal data and to control the risk of cybercrime. Monitor their effectiveness on an ongoing</text><text x="78" y="575" font-size="13" fill="#1F1A26">basis</text><line x1="56" y1="588" x2="56" y2="598" stroke="#4B2A85"></line><rect x="56" y="598" width="874" height="76" rx="4" fill="#FFFFFF" stroke="#E3DEEA"></rect><rect x="56" y="598" width="3" height="76" fill="#4B2A85"></rect><circle cx="56" cy="622" r="12" fill="#4B2A85"></circle><text x="56" y="627" text-anchor="middle" font-size="12" font-weight="700" fill="#FFFFFF">6</text><text x="78" y="624" font-size="14.5" fill="#4B2A85" font-weight="700">Accountability</text><text x="78" y="644" font-size="13" fill="#1F1A26">Appoint a senior member of staff to oversee data and cyber security. Ensure they have the right</text><text x="78" y="661" font-size="13" fill="#1F1A26">resources and support</text><line x1="56" y1="674" x2="56" y2="684" stroke="#4B2A85"></line><rect x="56" y="684" width="874" height="93" rx="4" fill="#FFFFFF" stroke="#E3DEEA"></rect><rect x="56" y="684" width="3" height="93" fill="#4B2A85"></rect><circle cx="56" cy="708" r="12" fill="#4B2A85"></circle><text x="56" y="713" text-anchor="middle" font-size="12" font-weight="700" fill="#FFFFFF">7</text><text x="78" y="710" font-size="14.5" fill="#4B2A85" font-weight="700">Cyber security policies</text><text x="78" y="730" font-size="13" fill="#1F1A26">Prepare and issue clear policies and procedures on all key aspects of data and cyber security.</text><text x="78" y="747" font-size="13" fill="#1F1A26">All staff should be made aware of their obligations. Include policies on staff use of business</text><text x="78" y="764" font-size="13" fill="#1F1A26">internet facilities, use of social media, and policies on bring your own device</text><line x1="56" y1="777" x2="56" y2="787" stroke="#4B2A85"></line><rect x="56" y="787" width="874" height="93" rx="4" fill="#FFFFFF" stroke="#E3DEEA"></rect><rect x="56" y="787" width="3" height="93" fill="#4B2A85"></rect><circle cx="56" cy="811" r="12" fill="#4B2A85"></circle><text x="56" y="816" text-anchor="middle" font-size="12" font-weight="700" fill="#FFFFFF">8</text><text x="78" y="813" font-size="14.5" fill="#4B2A85" font-weight="700">Monitoring and review</text><text x="78" y="833" font-size="13" fill="#1F1A26">Review systems and procedures regularly and respond to changes or problems, including attacks or</text><text x="78" y="850" font-size="13" fill="#1F1A26">disruption. Monitor and improve security controls to keep pace with your IT equipment, services</text><text x="78" y="867" font-size="13" fill="#1F1A26">and information.</text><line x1="56" y1="880" x2="56" y2="890" stroke="#4B2A85"></line><rect x="56" y="890" width="874" height="93" rx="4" fill="#FFFFFF" stroke="#E3DEEA"></rect><rect x="56" y="890" width="3" height="93" fill="#4B2A85"></rect><circle cx="56" cy="914" r="12" fill="#4B2A85"></circle><text x="56" y="919" text-anchor="middle" font-size="12" font-weight="700" fill="#FFFFFF">9</text><text x="78" y="916" font-size="14.5" fill="#4B2A85" font-weight="700">Cyber incident management</text><text x="78" y="936" font-size="13" fill="#1F1A26">Have a Cyber Incident Response Plan. If your practice is disrupted or attacked, this plan guides</text><text x="78" y="953" font-size="13" fill="#1F1A26">your response, ensures adequate measures are taken to contain the threat, and enables quick</text><text x="78" y="970" font-size="13" fill="#1F1A26">recovery where protection controls did not prevent the incident</text><line x1="56" y1="983" x2="56" y2="993" stroke="#4B2A85"></line><rect x="56" y="993" width="874" height="93" rx="4" fill="#FFFFFF" stroke="#E3DEEA"></rect><rect x="56" y="993" width="3" height="93" fill="#4B2A85"></rect><circle cx="56" cy="1017" r="12" fill="#4B2A85"></circle><text x="56" y="1022" text-anchor="middle" font-size="12" font-weight="700" fill="#FFFFFF">10</text><text x="78" y="1019" font-size="14.5" fill="#4B2A85" font-weight="700">Record keeping</text><text x="78" y="1039" font-size="13" fill="#1F1A26">Keep records, including details and evidence of your risk-based assessments, the technical and</text><text x="78" y="1056" font-size="13" fill="#1F1A26">organisational measures taken to protect the security of personal and client data, your</text><text x="78" y="1073" font-size="13" fill="#1F1A26">processes for testing and evaluating their effectiveness, and cyber-incident management</text></svg>