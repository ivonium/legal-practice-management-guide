<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 548" role="img" style="display:block;width:100%;height:auto;font-family:'Source Sans 3',system-ui,sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#4B2A85"></path></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#B8952E"></path></marker></defs>
<text x="30" y="26" font-size="12.5" letter-spacing="1.6" fill="#6B6478">PRACTICE MANAGEMENT · SECTION 7.6</text><line x1="30" y1="40" x2="930" y2="40" stroke="#B8952E" stroke-width="1"></line>
<rect x="30" y="66" width="288" height="30" fill="#4B2A85"></rect><text x="46" y="87" font-size="13.5" font-weight="700" fill="#FFFFFF">Existing clients</text><rect x="30" y="118" width="288" height="112" rx="3" fill="#FFFFFF" stroke="#E3DEEA"></rect><text x="44" y="138" font-size="12.5" fill="#1F1A26">1. Increase fee rates. A striking</text><text x="44" y="154" font-size="12.5" fill="#1F1A26">number of practitioners are still</text><text x="44" y="170" font-size="12.5" fill="#1F1A26">honouring rates set years ago</text><text x="44" y="186" font-size="12.5" fill="#1F1A26">because they have never been</text><text x="44" y="202" font-size="12.5" fill="#1F1A26">comfortable raising them. At</text><text x="44" y="218" font-size="12.5" fill="#1F1A26">minimum, index annually.</text><rect x="30" y="238" width="288" height="48" rx="3" fill="#FFFFFF" stroke="#E3DEEA"></rect><text x="44" y="258" font-size="12.5" fill="#1F1A26">2. Improve realisation. Unlock the</text><text x="44" y="274" font-size="12.5" fill="#1F1A26">value you already provide.</text><rect x="30" y="294" width="288" height="64" rx="3" fill="#FFFFFF" stroke="#E3DEEA"></rect><text x="44" y="314" font-size="12.5" fill="#1F1A26">3. Deepen. Win more of the same</text><text x="44" y="330" font-size="12.5" fill="#1F1A26">type of work; become a dominant</text><text x="44" y="346" font-size="12.5" fill="#1F1A26">provider of that service.</text><rect x="30" y="366" width="288" height="64" rx="3" fill="#FFFFFF" stroke="#E3DEEA"></rect><text x="44" y="386" font-size="12.5" fill="#1F1A26">4. Diversify. Increase the range</text><text x="44" y="402" font-size="12.5" fill="#1F1A26">of services and products provided</text><text x="44" y="418" font-size="12.5" fill="#1F1A26">to existing clients.</text><line x1="322" y1="82" x2="332" y2="82" stroke="#B8952E" marker-end="url(#ag)"></line><rect x="336" y="66" width="288" height="30" fill="#4B2A85"></rect><text x="352" y="87" font-size="13.5" font-weight="700" fill="#FFFFFF">New clients</text><rect x="336" y="118" width="288" height="64" rx="3" fill="#FFFFFF" stroke="#E3DEEA"></rect><text x="350" y="138" font-size="12.5" fill="#1F1A26">5. New clients won through the</text><text x="350" y="154" font-size="12.5" fill="#1F1A26">sales efforts of existing team</text><text x="350" y="170" font-size="12.5" fill="#1F1A26">members.</text><rect x="336" y="190" width="288" height="48" rx="3" fill="#FFFFFF" stroke="#E3DEEA"></rect><text x="350" y="210" font-size="12.5" fill="#1F1A26">6. New clients won by new sales</text><text x="350" y="226" font-size="12.5" fill="#1F1A26">channels.</text><rect x="336" y="246" width="288" height="64" rx="3" fill="#FFFFFF" stroke="#E3DEEA"></rect><text x="350" y="266" font-size="12.5" fill="#1F1A26">7. Increase the quality, size and</text><text x="350" y="282" font-size="12.5" fill="#1F1A26">frequency of referrals from</text><text x="350" y="298" font-size="12.5" fill="#1F1A26">existing sources.</text><rect x="336" y="318" width="288" height="48" rx="3" fill="#FFFFFF" stroke="#E3DEEA"></rect><text x="350" y="338" font-size="12.5" fill="#1F1A26">8. Expand the pool of referral</text><text x="350" y="354" font-size="12.5" fill="#1F1A26">sources.</text><rect x="336" y="374" width="288" height="48" rx="3" fill="#FFFFFF" stroke="#E3DEEA"></rect><text x="350" y="394" font-size="12.5" fill="#1F1A26">9. Acquire clients (lateral hires,</text><text x="350" y="410" font-size="12.5" fill="#1F1A26">practice acquisition).</text><line x1="628" y1="82" x2="638" y2="82" stroke="#B8952E" marker-end="url(#ag)"></line><rect x="642" y="66" width="288" height="30" fill="#4B2A85"></rect><text x="658" y="87" font-size="13.5" font-weight="700" fill="#FFFFFF">New products</text><rect x="642" y="118" width="288" height="80" rx="3" fill="#FFFFFF" stroke="#E3DEEA"></rect><text x="656" y="138" font-size="12.5" fill="#1F1A26">10. Commercialise existing</text><text x="656" y="154" font-size="12.5" fill="#1F1A26">products or services, including</text><text x="656" y="170" font-size="12.5" fill="#1F1A26">charging for things you currently</text><text x="656" y="186" font-size="12.5" fill="#1F1A26">give away.</text><rect x="642" y="206" width="288" height="48" rx="3" fill="#FFFFFF" stroke="#E3DEEA"></rect><text x="656" y="226" font-size="12.5" fill="#1F1A26">11. Develop new products or</text><text x="656" y="242" font-size="12.5" fill="#1F1A26">services.</text><rect x="30" y="430" width="900" height="52" rx="4" fill="#F5EFDD" stroke="#B8952E" stroke-width="1.6"></rect><text x="48" y="462" font-size="15" font-weight="700" fill="#1F1A26">12. Reduce, stop or divest. Getting rid of the wrong clients is a legitimate growth strategy.</text><text x="30" y="510" font-size="13.5" fill="#1F1A26" font-weight="600">Growth gets harder and more expensive as you move left to right. Most practitioners skip straight to new clients and new</text><text x="30" y="528" font-size="13.5" fill="#1F1A26" font-weight="600">products and neglect the first column, which is the cheapest.</text></svg>