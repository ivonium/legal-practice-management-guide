<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 384" role="img" style="display:block;width:100%;height:auto;font-family:'Source Sans 3',system-ui,sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#4B2A85"></path></marker></defs>
<text x="30" y="26" font-size="12.5" letter-spacing="1.6" fill="#6B6478">RISK MANAGEMENT · SECTION 5.1</text><line x1="30" y1="40" x2="930" y2="40" stroke="#B8952E" stroke-width="1"></line>
<rect x="30" y="66" width="216" height="250" rx="4" fill="#FFFFFF" stroke="#4B2A85" stroke-width="1.3"></rect><circle cx="54" cy="92" r="12" fill="#4B2A85"></circle><text x="54" y="97" text-anchor="middle" font-size="12" font-weight="700" fill="#FFFFFF">1</text><text x="46" y="132" font-size="14.5" fill="#4B2A85" font-weight="700">There is no time limit on</text><text x="46" y="151" font-size="14.5" fill="#4B2A85" font-weight="700">making a file note.</text><text x="46" y="184" font-size="13" fill="#1F1A26">If it is September and you</text><text x="46" y="201" font-size="13" fill="#1F1A26">realise you never noted a</text><text x="46" y="218" font-size="13" fill="#1F1A26">July meeting, make the note</text><text x="46" y="235" font-size="13" fill="#1F1A26">tonight.</text><rect x="258" y="66" width="216" height="250" rx="4" fill="#FFFFFF" stroke="#4B2A85" stroke-width="1.3"></rect><circle cx="282" cy="92" r="12" fill="#4B2A85"></circle><text x="282" y="97" text-anchor="middle" font-size="12" font-weight="700" fill="#FFFFFF">2</text><text x="274" y="132" font-size="14.5" fill="#4B2A85" font-weight="700">Date it today.</text><text x="274" y="165" font-size="13" fill="#1F1A26">If handwriting it, put</text><text x="274" y="182" font-size="13" fill="#1F1A26">today’s date and describe</text><text x="274" y="199" font-size="13" fill="#1F1A26">the earlier meeting or</text><text x="274" y="216" font-size="13" fill="#1F1A26">call. Electronic notes are</text><text x="274" y="233" font-size="13" fill="#1F1A26">better because the system</text><text x="274" y="250" font-size="13" fill="#1F1A26">time-stamps them.</text><rect x="486" y="66" width="216" height="250" rx="4" fill="#FFFFFF" stroke="#4B2A85" stroke-width="1.3"></rect><circle cx="510" cy="92" r="12" fill="#4B2A85"></circle><text x="510" y="97" text-anchor="middle" font-size="12" font-weight="700" fill="#FFFFFF">3</text><text x="502" y="132" font-size="14.5" fill="#4B2A85" font-weight="700">Never backdate a file</text><text x="502" y="151" font-size="14.5" fill="#4B2A85" font-weight="700">note.</text><text x="502" y="184" font-size="13" fill="#1F1A26">Practitioners have done it</text><text x="502" y="201" font-size="13" fill="#1F1A26">under pressure or distress</text><text x="502" y="218" font-size="13" fill="#1F1A26">and turned an omission into</text><text x="502" y="235" font-size="13" fill="#1F1A26">a fraudulent document.</text><rect x="714" y="66" width="216" height="250" rx="4" fill="#FFFFFF" stroke="#4B2A85" stroke-width="1.3"></rect><circle cx="738" cy="92" r="12" fill="#4B2A85"></circle><text x="738" y="97" text-anchor="middle" font-size="12" font-weight="700" fill="#FFFFFF">4</text><text x="730" y="132" font-size="14.5" fill="#4B2A85" font-weight="700">A note made today about a</text><text x="730" y="151" font-size="14.5" fill="#4B2A85" font-weight="700">July 2026 conversation is</text><text x="730" y="170" font-size="14.5" fill="#4B2A85" font-weight="700">far better than nothing</text><text x="730" y="189" font-size="14.5" fill="#4B2A85" font-weight="700">when the claim arrives in</text><text x="730" y="208" font-size="14.5" fill="#4B2A85" font-weight="700">2032.</text><text x="30" y="348" font-size="14" fill="#1F1A26" font-weight="600">A good file note can extinguish an allegation. Without documentation, a claim becomes very difficult to defend. Judges</text><text x="30" y="366" font-size="14" fill="#1F1A26" font-weight="600">expect a solicitor in private practice to have evidence of the advice they gave.</text></svg>