<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 532" role="img" style="display:block;width:100%;height:auto;font-family:'Source Sans 3',system-ui,sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#4B2A85"></path></marker>
<marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#B8952E"></path></marker></defs>
<text x="30" y="26" font-size="12.5" letter-spacing="1.6" fill="#6B6478">TRUST ACCOUNTING · SECTION 14.3</text><line x1="30" y1="40" x2="930" y2="40" stroke="#B8952E" stroke-width="1"></line>
<rect x="60" y="70" width="560" height="97" rx="4" fill="#FCEBEB" stroke="#D98C8C" stroke-width="1.4"></rect><circle cx="60" cy="96" r="13" fill="#D98C8C"></circle><text x="60" y="101" text-anchor="middle" font-size="13" font-weight="700" fill="#FFFFFF">1</text><text x="82" y="96" font-size="16" font-weight="700" fill="#1F1A26">Stop.</text><text x="82" y="118" font-size="13.5" fill="#1F1A26">Where there is a deficiency, suspend all activity on the trust</text><text x="82" y="136" font-size="13.5" fill="#1F1A26">account until it is resolved or made good. You cannot operate a</text><text x="82" y="154" font-size="13.5" fill="#1F1A26">trust account while a deficiency exists.</text><line x1="60" y1="167" x2="60" y2="185" stroke="#D98C8C" marker-end="url(#a)"></line><rect x="60" y="185" width="560" height="59" rx="4" fill="#FCEBEB" stroke="#D98C8C" stroke-width="1.4"></rect><circle cx="60" cy="211" r="13" fill="#D98C8C"></circle><text x="60" y="216" text-anchor="middle" font-size="13" font-weight="700" fill="#FFFFFF">2</text><text x="82" y="211" font-size="16" font-weight="700" fill="#1F1A26">Make it good.</text><text x="82" y="233" font-size="13.5" fill="#1F1A26">You may contribute your own funds. That is what lets you keep</text><text x="82" y="251" font-size="13.5" fill="#1F1A26">operating.</text><line x1="60" y1="244" x2="60" y2="262" stroke="#D98C8C" marker-end="url(#a)"></line><rect x="60" y="262" width="560" height="59" rx="4" fill="#FCEBEB" stroke="#D98C8C" stroke-width="1.4"></rect><circle cx="60" cy="288" r="13" fill="#D98C8C"></circle><text x="60" y="293" text-anchor="middle" font-size="13" font-weight="700" fill="#FFFFFF">3</text><text x="82" y="288" font-size="16" font-weight="700" fill="#1F1A26">Report</text><text x="82" y="310" font-size="13.5" fill="#1F1A26">to the DLRA.</text><line x1="60" y1="321" x2="60" y2="339" stroke="#D98C8C" marker-end="url(#a)"></line><rect x="60" y="339" width="560" height="59" rx="4" fill="#FCEBEB" stroke="#D98C8C" stroke-width="1.4"></rect><circle cx="60" cy="365" r="13" fill="#D98C8C"></circle><text x="60" y="370" text-anchor="middle" font-size="13" font-weight="700" fill="#FFFFFF">4</text><text x="82" y="365" font-size="16" font-weight="700" fill="#1F1A26">Take advice</text><text x="82" y="387" font-size="13.5" fill="#1F1A26">from the DLRA.</text><line x1="60" y1="398" x2="60" y2="416" stroke="#D98C8C" marker-end="url(#a)"></line><rect x="60" y="416" width="560" height="78" rx="4" fill="#FCEBEB" stroke="#D98C8C" stroke-width="1.4"></rect><circle cx="60" cy="442" r="13" fill="#D98C8C"></circle><text x="60" y="447" text-anchor="middle" font-size="13" font-weight="700" fill="#FFFFFF">5</text><text x="82" y="442" font-size="16" font-weight="700" fill="#1F1A26">Recover</text><text x="82" y="464" font-size="13.5" fill="#1F1A26">from the client afterwards if appropriate. Once you have replaced</text><text x="82" y="482" font-size="13.5" fill="#1F1A26">the money it is no longer trust money.</text><rect x="660" y="70" width="270" height="150" rx="4" fill="#FFFFFF" stroke="#D98C8C" stroke-width="1.6"></rect><text x="678" y="102" font-size="16" fill="#1F1A26" font-weight="700">Report it even if you have</text><text x="678" y="123" font-size="16" fill="#1F1A26" font-weight="700">already fixed it.</text><text x="678" y="168" font-size="13.5" fill="#1F1A26">If the examiner finds it and you</text><text x="678" y="186" font-size="13.5" fill="#1F1A26">did not report, the examiner</text><text x="678" y="204" font-size="13.5" fill="#1F1A26">reports the failure to report.</text></svg>