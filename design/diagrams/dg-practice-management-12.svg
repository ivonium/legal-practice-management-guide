<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 604" role="img" style="display:block;width:100%;height:auto;font-family:'Source Sans 3',system-ui,sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#4B2A85"></path></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#B8952E"></path></marker></defs>
<text x="30" y="26" font-size="12.5" letter-spacing="1.6" fill="#6B6478">PRACTICE MANAGEMENT · SECTION 7.5</text><line x1="30" y1="40" x2="930" y2="40" stroke="#B8952E" stroke-width="1"></line>
<text x="140" y="66" font-size="11.5" letter-spacing="1.2" fill="#6B6478">HIGH ATTRACTIVENESS</text><text x="530" y="66" font-size="11.5" letter-spacing="1.2" fill="#6B6478">LOW ATTRACTIVENESS</text><rect x="140" y="76" width="376" height="186" rx="4" fill="#EAE3F4" stroke="#4B2A85" stroke-width="1.6"></rect><text x="160" y="118" font-size="20" fill="#4B2A85" font-weight="700">Stars</text><text x="160" y="152" font-size="13" fill="#1F1A26">high growth, high attractiveness.</text><text x="160" y="169" font-size="13" fill="#1F1A26">Challenging work people want to do. Invest</text><rect x="530" y="76" width="376" height="186" rx="4" fill="#FFFFFF" stroke="#E3DEEA" stroke-width="1"></rect><text x="550" y="118" font-size="20" fill="#4B2A85" font-weight="700">Question marks</text><text x="550" y="152" font-size="13" fill="#1F1A26">possibly growing, but you are not passionate</text><text x="550" y="169" font-size="13" fill="#1F1A26">about the work or the clients. Interrogate</text><text x="550" y="186" font-size="13" fill="#1F1A26">whether you want this in the business</text><rect x="140" y="276" width="376" height="186" rx="4" fill="#FFFFFF" stroke="#E3DEEA" stroke-width="1"></rect><text x="160" y="318" font-size="20" fill="#4B2A85" font-weight="700">Cash cows</text><text x="160" y="352" font-size="13" fill="#1F1A26">bread and butter. Not high growth, but they</text><text x="160" y="369" font-size="13" fill="#1F1A26">pay on time, they are easy, they do not</text><text x="160" y="386" font-size="13" fill="#1F1A26">drain you. These keep you going</text><rect x="530" y="276" width="376" height="186" rx="4" fill="#FFFFFF" stroke="#E3DEEA" stroke-width="1"></rect><text x="550" y="318" font-size="20" fill="#4B2A85" font-weight="700">Dogs</text><text x="550" y="352" font-size="13" fill="#1F1A26">low growth, low attractiveness. No reason to</text><text x="550" y="369" font-size="13" fill="#1F1A26">keep doing this work</text><text x="60" y="176" font-size="11.5" letter-spacing="1.2" fill="#6B6478" transform="rotate(-90 60 176)">HIGH GROWTH</text><text x="60" y="380" font-size="11.5" letter-spacing="1.2" fill="#6B6478" transform="rotate(-90 60 380)">LOW GROWTH</text><line x1="30" y1="492" x2="930" y2="492" stroke="#B8952E"></line><text x="30" y="520" font-size="13.5" font-weight="700" fill="#4B2A85">Ask three questions</text><rect x="30" y="534" width="288" height="44" rx="22" fill="#FFFFFF" stroke="#B8952E"></rect><text x="174" y="562" text-anchor="middle" font-size="14" fill="#1F1A26">is there demand</text><rect x="336" y="534" width="288" height="44" rx="22" fill="#FFFFFF" stroke="#B8952E"></rect><text x="480" y="562" text-anchor="middle" font-size="14" fill="#1F1A26">do I have a strength in it</text><rect x="642" y="534" width="288" height="44" rx="22" fill="#FFFFFF" stroke="#B8952E"></rect><text x="786" y="562" text-anchor="middle" font-size="14" fill="#1F1A26">am I passionate about it</text></svg>