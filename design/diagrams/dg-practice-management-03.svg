<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 486" role="img" style="display:block;width:100%;height:auto;font-family:'Source Sans 3',system-ui,sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#4B2A85"></path></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#B8952E"></path></marker></defs>
<text x="30" y="26" font-size="12.5" letter-spacing="1.6" fill="#6B6478">PRACTICE MANAGEMENT · SECTION 1.5</text><line x1="30" y1="40" x2="930" y2="40" stroke="#B8952E" stroke-width="1"></line>
<rect x="30" y="66" width="170.4" height="196" rx="4" fill="#FFFFFF" stroke="#4B2A85" stroke-width="1.5"></rect><rect x="30" y="66" width="170.4" height="22" fill="#4B2A85"></rect><text x="42" y="82" font-size="11" letter-spacing="1.2" fill="#FFFFFF">MARKET</text><text x="42" y="114" font-size="15.5" fill="#4B2A85" font-weight="700">Leverage</text><text x="42" y="152" font-size="12.5" fill="#1F1A26">Market: you must find</text><text x="42" y="168" font-size="12.5" fill="#1F1A26">the people and have the</text><text x="42" y="184" font-size="12.5" fill="#1F1A26">work for them</text><text x="42" y="216" font-size="12.5" fill="#1F1A26" font-weight="600">Biggest impact, hardest</text><text x="42" y="232" font-size="12.5" fill="#1F1A26" font-weight="600">to move</text><rect x="212.4" y="66" width="170.4" height="196" rx="4" fill="#FFFFFF" stroke="#4B2A85" stroke-width="1.5"></rect><rect x="212.4" y="66" width="170.4" height="22" fill="#4B2A85"></rect><text x="224.4" y="82" font-size="11" letter-spacing="1.2" fill="#FFFFFF">MARKET</text><text x="224.4" y="114" font-size="15.5" fill="#4B2A85" font-weight="700">Price</text><text x="224.4" y="152" font-size="12.5" fill="#1F1A26">Market: it must be</text><text x="224.4" y="168" font-size="12.5" fill="#1F1A26">acceptable to clients</text><text x="224.4" y="216" font-size="12.5" fill="#1F1A26" font-weight="600">Biggest impact, most</text><text x="224.4" y="232" font-size="12.5" fill="#1F1A26" font-weight="600">used lever</text><rect x="394.8" y="66" width="170.4" height="196" rx="4" fill="#FFFFFF" stroke="#E3DEEA" stroke-width="1"></rect><rect x="394.8" y="66" width="170.4" height="22" fill="#F4F1F8"></rect><text x="406.8" y="82" font-size="11" letter-spacing="1.2" fill="#6B6478">INTERNAL</text><text x="406.8" y="114" font-size="15.5" fill="#4B2A85" font-weight="700">Chargeable hours</text><text x="406.8" y="152" font-size="12.5" fill="#1F1A26">Internal</text><text x="406.8" y="216" font-size="12.5" fill="#1F1A26" font-weight="600">Housekeeping. Fix it</text><text x="406.8" y="232" font-size="12.5" fill="#1F1A26" font-weight="600">tomorrow</text><rect x="577.2" y="66" width="170.4" height="196" rx="4" fill="#FFFFFF" stroke="#E3DEEA" stroke-width="1"></rect><rect x="577.2" y="66" width="170.4" height="22" fill="#F4F1F8"></rect><text x="589.2" y="82" font-size="11" letter-spacing="1.2" fill="#6B6478">INTERNAL</text><text x="589.2" y="114" font-size="15.5" fill="#4B2A85" font-weight="700">Realisation</text><text x="589.2" y="152" font-size="12.5" fill="#1F1A26">Internal</text><text x="589.2" y="216" font-size="12.5" fill="#1F1A26" font-weight="600">Housekeeping. Fix it</text><text x="589.2" y="232" font-size="12.5" fill="#1F1A26" font-weight="600">tomorrow</text><rect x="759.6" y="66" width="170.4" height="196" rx="4" fill="#FFFFFF" stroke="#E3DEEA" stroke-width="1"></rect><rect x="759.6" y="66" width="170.4" height="22" fill="#F4F1F8"></rect><text x="771.6" y="82" font-size="11" letter-spacing="1.2" fill="#6B6478">INTERNAL</text><text x="771.6" y="114" font-size="15.5" fill="#4B2A85" font-weight="700">Margin</text><text x="771.6" y="152" font-size="12.5" fill="#1F1A26">Internal</text><text x="771.6" y="216" font-size="12.5" fill="#1F1A26" font-weight="600">Housekeeping, but a</text><text x="771.6" y="232" font-size="12.5" fill="#1F1A26" font-weight="600">secondary driver</text><text x="30" y="302" font-size="12.5" letter-spacing="1.3" fill="#6B6478">THE PERFORMANCE BANDS</text><line x1="30" y1="320" x2="930" y2="320" stroke="#B8952E"></line><rect x="30" y="334" width="288" height="130" rx="4" fill="#FFFFFF" stroke="#E3DEEA"></rect><text x="46" y="372" font-size="22" font-weight="700" fill="#4B2A85">~$350,000</text><text x="46" y="398" font-size="12.5" fill="#1F1A26">Average on all five drivers</text><rect x="336" y="334" width="288" height="130" rx="4" fill="#FFFFFF" stroke="#E3DEEA"></rect><text x="352" y="372" font-size="22" font-weight="700" fill="#4B2A85">$350,000 to $700,000</text><text x="352" y="398" font-size="12.5" fill="#1F1A26">Very good on two, one of which must</text><text x="352" y="414" font-size="12.5" fill="#1F1A26">be leverage or price (you will not</text><text x="352" y="430" font-size="12.5" fill="#1F1A26">get both), plus average on the other</text><text x="352" y="446" font-size="12.5" fill="#1F1A26">three</text><rect x="642" y="334" width="288" height="130" rx="4" fill="#EAE3F4" stroke="#E3DEEA"></rect><text x="658" y="372" font-size="22" font-weight="700" fill="#4B2A85">$700,000+</text><text x="658" y="398" font-size="12.5" fill="#1F1A26">Very good on two, average on the</text><text x="658" y="414" font-size="12.5" fill="#1F1A26">rest, plus a homogeneous culture -</text><text x="658" y="430" font-size="12.5" fill="#1F1A26">specifically a culture that does not</text><text x="658" y="446" font-size="12.5" fill="#1F1A26">tolerate aberrant behaviour</text></svg>