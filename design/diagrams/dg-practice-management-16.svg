<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 410" role="img" style="display:block;width:100%;height:auto;font-family:'Source Sans 3',system-ui,sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#4B2A85"></path></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#B8952E"></path></marker></defs>
<text x="30" y="26" font-size="12.5" letter-spacing="1.6" fill="#6B6478">PRACTICE MANAGEMENT · SECTION 8.5</text><line x1="30" y1="40" x2="930" y2="40" stroke="#B8952E" stroke-width="1"></line>
<rect x="30" y="66" width="288" height="200" rx="4" fill="#FFFFFF" stroke="#4B2A85" stroke-width="1.5"></rect><rect x="30" y="66" width="288" height="44" fill="#4B2A85"></rect><text x="46" y="95" font-size="18" font-weight="700" fill="#FFFFFF">Lawful</text><text x="292" y="95" font-size="16" fill="#EAE3F4">1</text><text x="46" y="144" font-size="13.5" fill="#1F1A26">The easy one. You cannot assist</text><text x="46" y="162" font-size="13.5" fill="#1F1A26">someone to break the law</text><line x1="322" y1="166" x2="332" y2="166" stroke="#4B2A85" marker-end="url(#a)"></line><rect x="336" y="66" width="288" height="200" rx="4" fill="#FFFFFF" stroke="#4B2A85" stroke-width="1.5"></rect><rect x="336" y="66" width="288" height="44" fill="#4B2A85"></rect><text x="352" y="95" font-size="18" font-weight="700" fill="#FFFFFF">Proper</text><text x="598" y="95" font-size="16" fill="#EAE3F4">2</text><text x="352" y="144" font-size="13.5" fill="#1F1A26">Am I being asked to do something</text><text x="352" y="162" font-size="13.5" fill="#1F1A26">contrary to my broader ethical</text><text x="352" y="180" font-size="13.5" fill="#1F1A26">duties or the conduct rules?</text><line x1="628" y1="166" x2="638" y2="166" stroke="#4B2A85" marker-end="url(#a)"></line><rect x="642" y="66" width="288" height="200" rx="4" fill="#FFFFFF" stroke="#4B2A85" stroke-width="1.5"></rect><rect x="642" y="66" width="288" height="44" fill="#4B2A85"></rect><text x="658" y="95" font-size="18" font-weight="700" fill="#FFFFFF">Competent</text><text x="904" y="95" font-size="16" fill="#EAE3F4">3</text><text x="658" y="144" font-size="13.5" fill="#1F1A26">Am I satisfied the person</text><text x="658" y="162" font-size="13.5" fill="#1F1A26">understands the instructions and</text><text x="658" y="180" font-size="13.5" fill="#1F1A26">their consequences? In a</text><text x="658" y="198" font-size="13.5" fill="#1F1A26">commercial context, is this</text><text x="658" y="216" font-size="13.5" fill="#1F1A26">person authorised to give them?</text><rect x="30" y="290" width="900" height="56" rx="4" fill="#EAE3F4" stroke="#4B2A85"></rect><text x="48" y="324" font-size="16" font-weight="700" fill="#4B2A85">If all three boxes are ticked, the rule says you must follow.</text><text x="30" y="374" font-size="13.5" fill="#1F1A26">ASCR r 8: you must only accept and follow instructions that are lawful, proper and competent. At that point any moral</text><text x="30" y="392" font-size="13.5" fill="#1F1A26">squeamishness becomes irrelevant.</text></svg>