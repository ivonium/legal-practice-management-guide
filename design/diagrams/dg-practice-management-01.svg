<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 336" role="img" style="display:block;width:100%;height:auto;font-family:'Source Sans 3',system-ui,sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#4B2A85"></path></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#B8952E"></path></marker></defs>
<text x="30" y="26" font-size="12.5" letter-spacing="1.6" fill="#6B6478">PRACTICE MANAGEMENT · SECTION 1.2</text><line x1="30" y1="40" x2="930" y2="40" stroke="#B8952E" stroke-width="1"></line>
<rect x="30" y="66" width="216" height="250" rx="4" fill="#FFFFFF" stroke="#E3DEEA"></rect><rect x="30" y="66" width="216" height="4" fill="#4B2A85"></rect><text x="46" y="100" font-size="15" fill="#4B2A85" font-weight="700">Appropriate structure</text><text x="46" y="120" font-size="15" fill="#4B2A85" font-weight="700">for each practice group</text><circle cx="50" cy="146" r="2.5" fill="#B8952E"></circle><text x="62" y="150" font-size="12.5" fill="#1F1A26">Do not apply the same</text><text x="62" y="166" font-size="12.5" fill="#1F1A26">performance criteria to</text><text x="62" y="182" font-size="12.5" fill="#1F1A26">different groups</text><circle cx="50" cy="202" r="2.5" fill="#B8952E"></circle><text x="62" y="206" font-size="12.5" fill="#1F1A26">A commoditised</text><text x="62" y="222" font-size="12.5" fill="#1F1A26">conveyancing team and a</text><text x="62" y="238" font-size="12.5" fill="#1F1A26">complex disputes team are</text><text x="62" y="254" font-size="12.5" fill="#1F1A26">different businesses</text><text x="62" y="270" font-size="12.5" fill="#1F1A26">inside one firm</text><rect x="258" y="66" width="216" height="250" rx="4" fill="#FFFFFF" stroke="#E3DEEA"></rect><rect x="258" y="66" width="216" height="4" fill="#4B2A85"></rect><text x="274" y="100" font-size="15" fill="#4B2A85" font-weight="700">Get the people puzzle</text><text x="274" y="120" font-size="15" fill="#4B2A85" font-weight="700">right</text><circle cx="278" cy="146" r="2.5" fill="#B8952E"></circle><text x="290" y="150" font-size="12.5" fill="#1F1A26">Hold people accountable</text><text x="290" y="166" font-size="12.5" fill="#1F1A26">for what they can control</text><circle cx="278" cy="186" r="2.5" fill="#B8952E"></circle><text x="290" y="190" font-size="12.5" fill="#1F1A26">Be comfortable with</text><text x="290" y="206" font-size="12.5" fill="#1F1A26">different career paths.</text><text x="290" y="222" font-size="12.5" fill="#1F1A26">Not everyone is heading</text><text x="290" y="238" font-size="12.5" fill="#1F1A26">for equity</text><circle cx="278" cy="258" r="2.5" fill="#B8952E"></circle><text x="290" y="262" font-size="12.5" fill="#1F1A26">Build compensation systems</text><text x="290" y="278" font-size="12.5" fill="#1F1A26">that focus on the wider</text><text x="290" y="294" font-size="12.5" fill="#1F1A26">firm, not just individual</text><text x="290" y="310" font-size="12.5" fill="#1F1A26">billings</text><rect x="486" y="66" width="216" height="250" rx="4" fill="#FFFFFF" stroke="#E3DEEA"></rect><rect x="486" y="66" width="216" height="4" fill="#4B2A85"></rect><text x="502" y="100" font-size="15" fill="#4B2A85" font-weight="700">Pricing</text><circle cx="506" cy="126" r="2.5" fill="#B8952E"></circle><text x="518" y="130" font-size="12.5" fill="#1F1A26">Charge more than your cost</text><text x="518" y="146" font-size="12.5" fill="#1F1A26">of production. Always</text><circle cx="506" cy="166" r="2.5" fill="#B8952E"></circle><text x="518" y="170" font-size="12.5" fill="#1F1A26">Charge clients the way</text><text x="518" y="186" font-size="12.5" fill="#1F1A26">they want to be charged</text><rect x="714" y="66" width="216" height="250" rx="4" fill="#FFFFFF" stroke="#E3DEEA"></rect><rect x="714" y="66" width="216" height="4" fill="#4B2A85"></rect><text x="730" y="100" font-size="15" fill="#4B2A85" font-weight="700">Have a point of</text><text x="730" y="120" font-size="15" fill="#4B2A85" font-weight="700">difference</text><circle cx="734" cy="146" r="2.5" fill="#B8952E"></circle><text x="746" y="150" font-size="12.5" fill="#1F1A26">What makes your firm</text><text x="746" y="166" font-size="12.5" fill="#1F1A26">unique in the market that</text><text x="746" y="182" font-size="12.5" fill="#1F1A26">others cannot or will not</text><text x="746" y="198" font-size="12.5" fill="#1F1A26">emulate?</text><circle cx="734" cy="218" r="2.5" fill="#B8952E"></circle><text x="746" y="222" font-size="12.5" fill="#1F1A26">If that fails, be likeable</text></svg>