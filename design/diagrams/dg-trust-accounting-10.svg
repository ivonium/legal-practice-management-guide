<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 628" role="img" style="display:block;width:100%;height:auto;font-family:'Source Sans 3',system-ui,sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#4B2A85"></path></marker></defs>
<text x="30" y="26" font-size="12.5" letter-spacing="1.6" fill="#6B6478">TRUST ACCOUNTING · SECTION 8</text><line x1="30" y1="40" x2="930" y2="40" stroke="#B8952E" stroke-width="1"></line>
<rect x="330" y="64" width="300" height="52" rx="4" fill="#4B2A85"></rect><text x="480" y="88" text-anchor="middle" font-size="16" font-weight="700" fill="#FFFFFF">Month end</text><text x="480" y="106" text-anchor="middle" font-size="12" fill="#EAE3F4">both within 15 working days of month end (r 48)</text><line x1="480" y1="116" x2="480" y2="132" stroke="#4B2A85"></line><line x1="230" y1="132" x2="730" y2="132" stroke="#4B2A85"></line><line x1="230" y1="132" x2="230" y2="154" stroke="#4B2A85" marker-end="url(#a)"></line><line x1="730" y1="132" x2="730" y2="154" stroke="#4B2A85" marker-end="url(#a)"></line><rect x="30" y="158" width="400" height="196" rx="4" fill="#FFFFFF" stroke="#4B2A85" stroke-width="1.4"></rect><text x="50" y="188" font-size="16" fill="#4B2A85" font-weight="700">Trust trial balance</text><text x="50" y="210" font-size="12" font-weight="600" fill="#6B6478">r 48(2)(b)</text><text x="50" y="236" font-size="13.5" fill="#1F1A26">Sum of the individual trust ledgers against</text><text x="50" y="254" font-size="13.5" fill="#1F1A26">the reconciled cash book balance</text><rect x="50" y="266" width="360" height="64" rx="3" fill="#F5EFDD" stroke="#B8952E"></rect><text x="64" y="288" font-size="11" letter-spacing="1.1" fill="#6B6478">FAILURE MEANS</text><text x="64" y="306" font-size="13.5" fill="#1F1A26" font-weight="600">Something has been recorded against the</text><text x="64" y="323" font-size="13.5" fill="#1F1A26" font-weight="600">wrong client</text><rect x="530" y="158" width="400" height="196" rx="4" fill="#FFFFFF" stroke="#4B2A85" stroke-width="1.4"></rect><text x="550" y="188" font-size="16" fill="#4B2A85" font-weight="700">ADI reconciliation</text><text x="550" y="210" font-size="12" font-weight="600" fill="#6B6478">r 48(2)(a)</text><text x="550" y="236" font-size="13.5" fill="#1F1A26">Reconciled cash book balance against the ADI</text><text x="550" y="254" font-size="13.5" fill="#1F1A26">statement</text><rect x="550" y="266" width="360" height="47" rx="3" fill="#F5EFDD" stroke="#B8952E"></rect><text x="564" y="288" font-size="11" letter-spacing="1.1" fill="#6B6478">FAILURE MEANS</text><text x="564" y="306" font-size="13.5" fill="#1F1A26" font-weight="600">Money may be missing. A deficiency</text><rect x="30" y="380" width="900" height="224" rx="4" fill="#F4F1F8" stroke="#E3DEEA"></rect><text x="48" y="408" font-size="12.5" letter-spacing="1.3" fill="#6B6478">FORMAT · SECTION 8.3</text><text x="48" y="444" font-size="13.5" fill="#1F1A26" font-weight="400">ADI statement balance as at [date] (normally a credit balance)</text><line x1="48" y1="452" x2="912" y2="452" stroke="#E3DEEA"></line><text x="48" y="468" font-size="13.5" fill="#1F1A26" font-weight="400">Add outstanding deposits</text><line x1="48" y1="476" x2="912" y2="476" stroke="#E3DEEA"></line><text x="48" y="492" font-size="13.5" fill="#1F1A26" font-weight="400">Add/less items on the ADI statement not in the cash book</text><line x1="48" y1="500" x2="912" y2="500" stroke="#E3DEEA"></line><text x="48" y="516" font-size="13.5" fill="#1F1A26" font-weight="400">Less unpresented cheques (listed separately with date, cheque number and amount)</text><line x1="48" y1="524" x2="912" y2="524" stroke="#E3DEEA"></line><text x="48" y="540" font-size="13.5" fill="#1F1A26" font-weight="400">Add/less items in the cash book not on the ADI statement</text><line x1="48" y1="548" x2="912" y2="548" stroke="#E3DEEA"></line><text x="48" y="564" font-size="13.5" fill="#1F1A26" font-weight="700">= Reconciled cash book balance</text><line x1="48" y1="572" x2="912" y2="572" stroke="#E3DEEA"></line><text x="48" y="588" font-size="13.5" fill="#1F1A26" font-weight="400">Date of preparation and preparer</text><line x1="48" y1="596" x2="912" y2="596" stroke="#E3DEEA"></line></svg>