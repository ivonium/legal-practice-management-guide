<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 430" role="img" style="display:block;width:100%;height:auto;font-family:'Source Sans 3',system-ui,sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#4B2A85"></path></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#B8952E"></path></marker></defs>
<text x="30" y="26" font-size="12.5" letter-spacing="1.6" fill="#6B6478">PRACTICE MANAGEMENT · SECTION 1.7</text><line x1="30" y1="40" x2="930" y2="40" stroke="#B8952E" stroke-width="1"></line>
<rect x="30" y="66" width="440" height="240" rx="4" fill="#FFFFFF" stroke="#4B2A85" stroke-width="1.4"></rect><text x="50" y="104" font-size="19" fill="#4B2A85" font-weight="700">Battery hen</text><text x="50" y="140" font-size="13.5" fill="#1F1A26">Here is your salary. In return produce $X in fees.</text><text x="50" y="158" font-size="13.5" fill="#1F1A26">Here is your hourly rate, so here are your</text><text x="50" y="176" font-size="13.5" fill="#1F1A26">required hours. We will also measure your</text><text x="50" y="194" font-size="13.5" fill="#1F1A26">write-downs, your debtors and your WIP. We have</text><text x="50" y="212" font-size="13.5" fill="#1F1A26">expensive software, so we will look at it weekly</text><text x="50" y="230" font-size="13.5" fill="#1F1A26">and yell at you monthly</text><rect x="490" y="66" width="440" height="240" rx="4" fill="#F5EFDD" stroke="#B8952E" stroke-width="1.4"></rect><text x="510" y="104" font-size="19" fill="#1F1A26" font-weight="700">Free range</text><text x="510" y="140" font-size="13.5" fill="#1F1A26">Delighted to have you. I will give you as much</text><text x="510" y="158" font-size="13.5" fill="#1F1A26">work as you can chew through. Do it to the best of</text><text x="510" y="176" font-size="13.5" fill="#1F1A26">your ability and capture the activity. Record your</text><text x="510" y="194" font-size="13.5" fill="#1F1A26">hours. If it is fixed fee work, recording hours</text><text x="510" y="212" font-size="13.5" fill="#1F1A26">matters more, because we need to know the cost of</text><text x="510" y="230" font-size="13.5" fill="#1F1A26">delivery</text><line x1="30" y1="330" x2="930" y2="330" stroke="#B8952E"></line><text x="30" y="364" font-size="18" font-weight="700" fill="#4B2A85">Free range people for as long as you can, then battery hen them.</text><text x="30" y="392" font-size="13.5" fill="#1F1A26">You cannot go back the other way. Free range is where the lawyer still believes in Santa; battery hen is where they</text><text x="30" y="410" font-size="13.5" fill="#1F1A26">know there is no Santa.</text></svg>