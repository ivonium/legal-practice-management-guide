<text x="30" y="26" font-size="12.5" letter-spacing="1.6" fill="#6B6478">TRUST ACCOUNTING · SECTION 20 · COUNTS FROM A RECENT YEAR’S EXAMINATION DATA</text><line x1="30" y1="40" x2="930" y2="40" stroke="#B8952E" stroke-width="1"></line>
<text x="30" y="84" font-size="12.5" font-weight="600" fill="#6B6478">r 48(3)</text><rect x="150" y="72" width="560" height="16" fill="#F4F1F8"></rect><rect x="150" y="72" width="560" height="16" fill="#4B2A85"></rect><text x="722" y="85" font-size="13" font-weight="700" fill="#1F1A26" font-family="ui-monospace,Menlo,monospace">317</text><text x="150" y="102" font-size="12" fill="#6B6478">Reconciliation statements not prepared within 15 days after month end</text><text x="30" y="118" font-size="12.5" font-weight="600" fill="#6B6478">r 48(3)</text><rect x="150" y="106" width="560" height="16" fill="#F4F1F8"></rect><rect x="150" y="106" width="385" height="16" fill="#4B2A85"></rect><text x="722" y="119" font-size="13" font-weight="700" fill="#1F1A26" font-family="ui-monospace,Menlo,monospace">218</text><text x="150" y="136" font-size="12" fill="#6B6478">Trust trial balances not prepared within 15 days of month end</text><text x="30" y="152" font-size="12.5" font-weight="600" fill="#6B6478">Application Reg</text><rect x="150" y="140" width="560" height="16" fill="#F4F1F8"></rect><rect x="150" y="140" width="309" height="16" fill="#4B2A85"></rect><text x="722" y="153" font-size="13" font-weight="700" fill="#1F1A26" font-family="ui-monospace,Menlo,monospace">175</text><text x="150" y="170" font-size="12" fill="#6B6478">Statutory deposit review not completed within the required banking days</text><text x="30" y="186" font-size="12.5" font-weight="600" fill="#6B6478">r 44(3)</text><rect x="150" y="174" width="560" height="16" fill="#F4F1F8"></rect><rect x="150" y="174" width="228" height="16" fill="#4B2A85"></rect><text x="722" y="187" font-size="13" font-weight="700" fill="#1F1A26" font-family="ui-monospace,Menlo,monospace">129</text><text x="150" y="204" font-size="12" fill="#6B6478">Receipts not recorded in the receipts cash book within 5 working days</text><text x="30" y="220" font-size="12.5" font-weight="600" fill="#6B6478">r 45(2)(b)</text><rect x="150" y="208" width="560" height="16" fill="#F4F1F8"></rect><rect x="150" y="208" width="189" height="16" fill="#4B2A85"></rect><text x="722" y="221" font-size="13" font-weight="700" fill="#1F1A26" font-family="ui-monospace,Menlo,monospace">107</text><text x="150" y="238" font-size="12" fill="#6B6478">Payments not recorded in the payments cash book within 5 days</text><text x="30" y="254" font-size="12.5" font-weight="600" fill="#6B6478">r 48</text><rect x="150" y="242" width="560" height="16" fill="#F4F1F8"></rect><rect x="150" y="242" width="157" height="16" fill="#4B2A85"></rect><text x="722" y="255" font-size="13" font-weight="700" fill="#1F1A26" font-family="ui-monospace,Menlo,monospace">89</text><text x="150" y="272" font-size="12" fill="#6B6478">Stale cheques not reversed</text><text x="30" y="288" font-size="12.5" font-weight="600" fill="#6B6478">r 64(8)</text><rect x="150" y="276" width="560" height="16" fill="#F4F1F8"></rect><rect x="150" y="276" width="131" height="16" fill="#4B2A85"></rect><text x="722" y="289" font-size="13" font-weight="700" fill="#1F1A26" font-family="ui-monospace,Menlo,monospace">74</text><text x="150" y="306" font-size="12" fill="#6B6478">Controlled money listings not prepared within 15 working days of month end</text><text x="30" y="322" font-size="12.5" font-weight="600" fill="#6B6478">Application Reg</text><rect x="150" y="310" width="560" height="16" fill="#F4F1F8"></rect><rect x="150" y="310" width="124" height="16" fill="#4B2A85"></rect><text x="722" y="323" font-size="13" font-weight="700" fill="#1F1A26" font-family="ui-monospace,Menlo,monospace">70</text><text x="150" y="340" font-size="12" fill="#6B6478">Amount on statutory deposit not in accordance with the practice’s own calculation</text><text x="30" y="356" font-size="12.5" font-weight="600" fill="#6B6478">r 52</text><rect x="150" y="344" width="560" height="16" fill="#F4F1F8"></rect><rect x="150" y="344" width="122" height="16" fill="#4B2A85"></rect><text x="722" y="357" font-size="13" font-weight="700" fill="#1F1A26" font-family="ui-monospace,Menlo,monospace">69</text><text x="150" y="374" font-size="12" fill="#6B6478">Trust account statements not sent at 30 June</text><text x="30" y="390" font-size="12.5" font-weight="600" fill="#6B6478">r 47(3)(e)(i)</text><rect x="150" y="378" width="560" height="16" fill="#F4F1F8"></rect><rect x="150" y="378" width="110" height="16" fill="#4B2A85"></rect><text x="722" y="391" font-size="13" font-weight="700" fill="#1F1A26" font-family="ui-monospace,Menlo,monospace">62</text><text x="150" y="408" font-size="12" fill="#6B6478">Trust ledger does not record the form in which money was received</text><text x="30" y="424" font-size="12.5" font-weight="600" fill="#6B6478">r 61(b)</text><rect x="150" y="412" width="560" height="16" fill="#F4F1F8"></rect><rect x="150" y="412" width="97" height="16" fill="#4B2A85"></rect><text x="722" y="425" font-size="13" font-weight="700" fill="#1F1A26" font-family="ui-monospace,Menlo,monospace">55</text><text x="150" y="442" font-size="12" fill="#6B6478">CMA name lacks &#34;controlled money account&#34;, &#34;CMA&#34; or &#34;CMA/c&#34;</text><text x="30" y="458" font-size="12.5" font-weight="600" fill="#6B6478">r 47(4)(b)</text><rect x="150" y="446" width="560" height="16" fill="#F4F1F8"></rect><rect x="150" y="446" width="92" height="16" fill="#4B2A85"></rect><text x="722" y="459" font-size="13" font-weight="700" fill="#1F1A26" font-family="ui-monospace,Menlo,monospace">52</text><text x="150" y="476" font-size="12" fill="#6B6478">Trust ledger transaction not posted within 5 working days</text><text x="30" y="492" font-size="12.5" font-weight="600" fill="#6B6478">r 52(4)(a)</text><rect x="150" y="480" width="560" height="16" fill="#F4F1F8"></rect><rect x="150" y="480" width="85" height="16" fill="#4B2A85"></rect><text x="722" y="493" font-size="13" font-weight="700" fill="#1F1A26" font-family="ui-monospace,Menlo,monospace">48</text><text x="150" y="510" font-size="12" fill="#6B6478">Statements not issued as soon as practicable after completion of a matter</text><text x="30" y="526" font-size="12.5" font-weight="600" fill="#6B6478">r 48(1)</text><rect x="150" y="514" width="560" height="16" fill="#F4F1F8"></rect><rect x="150" y="514" width="83" height="16" fill="#4B2A85"></rect><text x="722" y="527" font-size="13" font-weight="700" fill="#1F1A26" font-family="ui-monospace,Menlo,monospace">47</text><text x="150" y="544" font-size="12" fill="#6B6478">Reconciliation statements not prepared every month</text><text x="30" y="560" font-size="12.5" font-weight="600" fill="#6B6478">r 48(2)(a)(i)</text><rect x="150" y="548" width="560" height="16" fill="#F4F1F8"></rect><rect x="150" y="548" width="79" height="16" fill="#4B2A85"></rect><text x="722" y="561" font-size="13" font-weight="700" fill="#1F1A26" font-family="ui-monospace,Menlo,monospace">45</text><text x="150" y="578" font-size="12" fill="#6B6478">Reconciliation does not reconcile the ADI balance to the cash book balance</text><text x="30" y="594" font-size="12.5" font-weight="600" fill="#6B6478">r 43(1)(a)</text><rect x="150" y="582" width="560" height="16" fill="#F4F1F8"></rect><rect x="150" y="582" width="78" height="16" fill="#4B2A85"></rect><text x="722" y="595" font-size="13" font-weight="700" fill="#1F1A26" font-family="ui-monospace,Menlo,monospace">44</text><text x="150" y="612" font-size="12" fill="#6B6478">Cheques not payable to a specified person, or drawn to bearer or cash</text><line x1="30" y1="626" x2="930" y2="626" stroke="#B8952E"></line><text x="30" y="652" font-size="15" font-weight="700" fill="#1F1A26">The pattern: almost every breach is a timing breach on month end procedures or posting. They are entirely avoidable.</text></svg>