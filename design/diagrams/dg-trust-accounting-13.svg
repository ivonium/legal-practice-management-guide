<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 534" role="img" style="display:block;width:100%;height:auto;font-family:'Source Sans 3',system-ui,sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#4B2A85"></path></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#B8952E"></path></marker></defs>
<text x="30" y="26" font-size="12.5" letter-spacing="1.6" fill="#6B6478">TRUST ACCOUNTING · SECTION 13.2 · COMPANION TO THE CALCULATOR</text><line x1="30" y1="40" x2="930" y2="40" stroke="#B8952E" stroke-width="1"></line>
<rect x="30" y="70" width="640" height="95" rx="4" fill="#FFFFFF" stroke="#4B2A85" stroke-width="1.3"></rect><text x="50" y="96" font-size="15" fill="#4B2A85" font-weight="700">Base amount</text><text x="50" y="117" font-size="13" fill="#1F1A26">the lowest balance in the trust account during the previous applicable</text><text x="50" y="134" font-size="13" fill="#1F1A26">period, plus the amount on statutory deposit on the day that lowest</text><text x="50" y="151" font-size="13" fill="#1F1A26">balance was recorded</text><line x1="350" y1="165" x2="350" y2="181" stroke="#4B2A85" marker-end="url(#a)"></line><rect x="30" y="181" width="640" height="95" rx="4" fill="#F5EFDD" stroke="#B8952E" stroke-width="1.6"></rect><text x="50" y="207" font-size="15" fill="#1F1A26" font-weight="700">The 80% look-forward</text><text x="50" y="228" font-size="13" fill="#1F1A26">if, on any day from the end of the previous applicable period to the</text><text x="50" y="245" font-size="13" fill="#1F1A26">15th banking day after it, the equivalent sum is lower than the base</text><text x="50" y="262" font-size="13" fill="#1F1A26">amount, the minimum becomes 80% of that lower sum</text><line x1="350" y1="276" x2="350" y2="292" stroke="#4B2A85" marker-end="url(#a)"></line><rect x="30" y="292" width="640" height="61" rx="4" fill="#FFFFFF" stroke="#4B2A85" stroke-width="1.3"></rect><text x="50" y="318" font-size="15" fill="#4B2A85" font-weight="700">Threshold</text><text x="50" y="339" font-size="13" fill="#1F1A26">if the combined balance is under $10,000, no deposit is required</text><line x1="350" y1="353" x2="350" y2="369" stroke="#4B2A85" marker-end="url(#a)"></line><rect x="30" y="369" width="640" height="56" rx="4" fill="#FFFFFF" stroke="#4B2A85" stroke-width="1.3"></rect><text x="50" y="395" font-size="15" fill="#4B2A85" font-weight="700">Round up to the next hundred dollars</text><line x1="350" y1="425" x2="350" y2="441" stroke="#4B2A85" marker-end="url(#a)"></line><rect x="30" y="441" width="640" height="61" rx="4" fill="#FFFFFF" stroke="#4B2A85" stroke-width="1.3"></rect><text x="50" y="467" font-size="15" fill="#4B2A85" font-weight="700">Deposit not later than 20 banking days after the end</text><text x="50" y="486" font-size="15" fill="#4B2A85" font-weight="700">of the applicable period</text><text x="50" y="507" font-size="13" fill="#1F1A26">Application Regulation s 13</text><rect x="700" y="70" width="230" height="200" rx="4" fill="#F4F1F8" stroke="#E3DEEA"></rect><text x="718" y="98" font-size="11" letter-spacing="1.2" fill="#6B6478">APPLICABLE PERIOD ENDS</text><text x="718" y="128" font-size="15" font-weight="700" fill="#4B2A85">31 March</text><line x1="718" y1="136" x2="912" y2="136" stroke="#E3DEEA"></line><text x="718" y="158" font-size="15" font-weight="700" fill="#4B2A85">30 June</text><line x1="718" y1="166" x2="912" y2="166" stroke="#E3DEEA"></line><text x="718" y="188" font-size="15" font-weight="700" fill="#4B2A85">30 September</text><line x1="718" y1="196" x2="912" y2="196" stroke="#E3DEEA"></line><text x="718" y="218" font-size="15" font-weight="700" fill="#4B2A85">31 December</text><line x1="718" y1="226" x2="912" y2="226" stroke="#E3DEEA"></line><text x="700" y="268" font-size="12.5" fill="#6B6478">Applicable period: the 3</text><text x="700" y="284" font-size="12.5" fill="#6B6478">months ending 31 March, 30</text><text x="700" y="300" font-size="12.5" fill="#6B6478">June, 30 September or 31</text><text x="700" y="316" font-size="12.5" fill="#6B6478">December (Application</text><text x="700" y="332" font-size="12.5" fill="#6B6478">Regulation s 10).</text></svg>