<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 698" role="img" style="display:block;width:100%;height:auto;font-family:'Source Sans 3',system-ui,sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#4B2A85"></path></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#B8952E"></path></marker></defs>
<text x="30" y="26" font-size="12.5" letter-spacing="1.6" fill="#6B6478">PRACTICE MANAGEMENT · SECTION 1.12</text><line x1="30" y1="40" x2="930" y2="40" stroke="#B8952E" stroke-width="1"></line>
<text x="30" y="76" font-size="11.5" letter-spacing="1.2" fill="#6B6478">SCORE YOUR FIRM HONESTLY</text><text x="736" y="76" text-anchor="middle" font-size="12" font-weight="600" fill="#6B6478">1</text><text x="776" y="76" text-anchor="middle" font-size="12" font-weight="600" fill="#6B6478">2</text><text x="816" y="76" text-anchor="middle" font-size="12" font-weight="600" fill="#6B6478">3</text><text x="856" y="76" text-anchor="middle" font-size="12" font-weight="600" fill="#6B6478">4</text><text x="896" y="76" text-anchor="middle" font-size="12" font-weight="600" fill="#6B6478">5</text><rect x="30" y="88" width="900" height="50" rx="3" fill="#FFFFFF" stroke="#E3DEEA"></rect><text x="48" y="114" font-size="13" font-weight="700" fill="#B8952E">1</text><text x="70" y="114" font-size="13.5" fill="#1F1A26">Client satisfaction is a top priority of the firm.</text><circle cx="736" cy="113" r="9" fill="#FFFFFF" stroke="#4B2A85" stroke-width="1.3"></circle><circle cx="776" cy="113" r="9" fill="#FFFFFF" stroke="#4B2A85" stroke-width="1.3"></circle><circle cx="816" cy="113" r="9" fill="#FFFFFF" stroke="#4B2A85" stroke-width="1.3"></circle><circle cx="856" cy="113" r="9" fill="#FFFFFF" stroke="#4B2A85" stroke-width="1.3"></circle><circle cx="896" cy="113" r="9" fill="#FFFFFF" stroke="#4B2A85" stroke-width="1.3"></circle><rect x="30" y="146" width="900" height="62" rx="3" fill="#F4F1F8" stroke="#E3DEEA"></rect><text x="48" y="172" font-size="13" font-weight="700" fill="#B8952E">2</text><text x="70" y="172" font-size="13.5" fill="#1F1A26">The firm has no room for those who put their personal agenda ahead of the</text><text x="70" y="190" font-size="13.5" fill="#1F1A26">interests of clients or the firm.</text><circle cx="736" cy="177" r="9" fill="#FFFFFF" stroke="#4B2A85" stroke-width="1.3"></circle><circle cx="776" cy="177" r="9" fill="#FFFFFF" stroke="#4B2A85" stroke-width="1.3"></circle><circle cx="816" cy="177" r="9" fill="#FFFFFF" stroke="#4B2A85" stroke-width="1.3"></circle><circle cx="856" cy="177" r="9" fill="#FFFFFF" stroke="#4B2A85" stroke-width="1.3"></circle><circle cx="896" cy="177" r="9" fill="#FFFFFF" stroke="#4B2A85" stroke-width="1.3"></circle><rect x="30" y="216" width="900" height="62" rx="3" fill="#FFFFFF" stroke="#E3DEEA"></rect><text x="48" y="242" font-size="13" font-weight="700" fill="#B8952E">3</text><text x="70" y="242" font-size="13.5" fill="#1F1A26">Those who contribute most to the overall success of the firm are the most</text><text x="70" y="260" font-size="13.5" fill="#1F1A26">highly rewarded.</text><circle cx="736" cy="247" r="9" fill="#FFFFFF" stroke="#4B2A85" stroke-width="1.3"></circle><circle cx="776" cy="247" r="9" fill="#FFFFFF" stroke="#4B2A85" stroke-width="1.3"></circle><circle cx="816" cy="247" r="9" fill="#FFFFFF" stroke="#4B2A85" stroke-width="1.3"></circle><circle cx="856" cy="247" r="9" fill="#FFFFFF" stroke="#4B2A85" stroke-width="1.3"></circle><circle cx="896" cy="247" r="9" fill="#FFFFFF" stroke="#4B2A85" stroke-width="1.3"></circle><rect x="30" y="286" width="900" height="50" rx="3" fill="#F4F1F8" stroke="#E3DEEA"></rect><text x="48" y="312" font-size="13" font-weight="700" fill="#B8952E">4</text><text x="70" y="312" font-size="13.5" fill="#1F1A26">Management gets the best out of everybody in the firm.</text><circle cx="736" cy="311" r="9" fill="#FFFFFF" stroke="#4B2A85" stroke-width="1.3"></circle><circle cx="776" cy="311" r="9" fill="#FFFFFF" stroke="#4B2A85" stroke-width="1.3"></circle><circle cx="816" cy="311" r="9" fill="#FFFFFF" stroke="#4B2A85" stroke-width="1.3"></circle><circle cx="856" cy="311" r="9" fill="#FFFFFF" stroke="#4B2A85" stroke-width="1.3"></circle><circle cx="896" cy="311" r="9" fill="#FFFFFF" stroke="#4B2A85" stroke-width="1.3"></circle><rect x="30" y="344" width="900" height="50" rx="3" fill="#FFFFFF" stroke="#E3DEEA"></rect><text x="48" y="370" font-size="13" font-weight="700" fill="#B8952E">5</text><text x="70" y="370" font-size="13.5" fill="#1F1A26">Around here you are required, not just encouraged, to learn new skills.</text><circle cx="736" cy="369" r="9" fill="#FFFFFF" stroke="#4B2A85" stroke-width="1.3"></circle><circle cx="776" cy="369" r="9" fill="#FFFFFF" stroke="#4B2A85" stroke-width="1.3"></circle><circle cx="816" cy="369" r="9" fill="#FFFFFF" stroke="#4B2A85" stroke-width="1.3"></circle><circle cx="856" cy="369" r="9" fill="#FFFFFF" stroke="#4B2A85" stroke-width="1.3"></circle><circle cx="896" cy="369" r="9" fill="#FFFFFF" stroke="#4B2A85" stroke-width="1.3"></circle><rect x="30" y="402" width="900" height="62" rx="3" fill="#F4F1F8" stroke="#E3DEEA"></rect><text x="48" y="428" font-size="13" font-weight="700" fill="#B8952E">6</text><text x="70" y="428" font-size="13.5" fill="#1F1A26">The firm invests a significant amount of time in things that will pay off in</text><text x="70" y="446" font-size="13.5" fill="#1F1A26">the future.</text><circle cx="736" cy="433" r="9" fill="#FFFFFF" stroke="#4B2A85" stroke-width="1.3"></circle><circle cx="776" cy="433" r="9" fill="#FFFFFF" stroke="#4B2A85" stroke-width="1.3"></circle><circle cx="816" cy="433" r="9" fill="#FFFFFF" stroke="#4B2A85" stroke-width="1.3"></circle><circle cx="856" cy="433" r="9" fill="#FFFFFF" stroke="#4B2A85" stroke-width="1.3"></circle><circle cx="896" cy="433" r="9" fill="#FFFFFF" stroke="#4B2A85" stroke-width="1.3"></circle><rect x="30" y="472" width="900" height="50" rx="3" fill="#FFFFFF" stroke="#E3DEEA"></rect><text x="48" y="498" font-size="13" font-weight="700" fill="#B8952E">7</text><text x="70" y="498" font-size="13.5" fill="#1F1A26">People within the office always treat others with respect.</text><circle cx="736" cy="497" r="9" fill="#FFFFFF" stroke="#4B2A85" stroke-width="1.3"></circle><circle cx="776" cy="497" r="9" fill="#FFFFFF" stroke="#4B2A85" stroke-width="1.3"></circle><circle cx="816" cy="497" r="9" fill="#FFFFFF" stroke="#4B2A85" stroke-width="1.3"></circle><circle cx="856" cy="497" r="9" fill="#FFFFFF" stroke="#4B2A85" stroke-width="1.3"></circle><circle cx="896" cy="497" r="9" fill="#FFFFFF" stroke="#4B2A85" stroke-width="1.3"></circle><rect x="30" y="530" width="900" height="50" rx="3" fill="#F4F1F8" stroke="#E3DEEA"></rect><text x="48" y="556" font-size="13" font-weight="700" fill="#B8952E">8</text><text x="70" y="556" font-size="13.5" fill="#1F1A26">The quality of supervision of client files and projects is uniformly high.</text><circle cx="736" cy="555" r="9" fill="#FFFFFF" stroke="#4B2A85" stroke-width="1.3"></circle><circle cx="776" cy="555" r="9" fill="#FFFFFF" stroke="#4B2A85" stroke-width="1.3"></circle><circle cx="816" cy="555" r="9" fill="#FFFFFF" stroke="#4B2A85" stroke-width="1.3"></circle><circle cx="856" cy="555" r="9" fill="#FFFFFF" stroke="#4B2A85" stroke-width="1.3"></circle><circle cx="896" cy="555" r="9" fill="#FFFFFF" stroke="#4B2A85" stroke-width="1.3"></circle><rect x="30" y="588" width="900" height="50" rx="3" fill="#FFFFFF" stroke="#E3DEEA"></rect><text x="48" y="614" font-size="13" font-weight="700" fill="#B8952E">9</text><text x="70" y="614" font-size="13.5" fill="#1F1A26">The quality of professionals in our office is as high as can be expected.</text><circle cx="736" cy="613" r="9" fill="#FFFFFF" stroke="#4B2A85" stroke-width="1.3"></circle><circle cx="776" cy="613" r="9" fill="#FFFFFF" stroke="#4B2A85" stroke-width="1.3"></circle><circle cx="816" cy="613" r="9" fill="#FFFFFF" stroke="#4B2A85" stroke-width="1.3"></circle><circle cx="856" cy="613" r="9" fill="#FFFFFF" stroke="#4B2A85" stroke-width="1.3"></circle><circle cx="896" cy="613" r="9" fill="#FFFFFF" stroke="#4B2A85" stroke-width="1.3"></circle><text x="30" y="672" font-size="13.5" fill="#1F1A26" font-weight="600">These nine statements predict firm success more reliably than most financial metrics.</text></svg>