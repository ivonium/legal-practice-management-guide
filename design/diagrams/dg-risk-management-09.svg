<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 586" role="img" style="display:block;width:100%;height:auto;font-family:'Source Sans 3',system-ui,sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#4B2A85"></path></marker></defs>
<text x="30" y="26" font-size="12.5" letter-spacing="1.6" fill="#6B6478">RISK MANAGEMENT · SECTION 8.6</text><line x1="30" y1="40" x2="930" y2="40" stroke="#B8952E" stroke-width="1"></line>
<rect x="30" y="66" width="290" height="228" rx="4" fill="#FFFFFF" stroke="#E3DEEA"></rect><rect x="30" y="66" width="290" height="4" fill="#4B2A85"></rect><circle cx="56" cy="100" r="12" fill="#EAE3F4"></circle><text x="56" y="105" text-anchor="middle" font-size="12" font-weight="700" fill="#4B2A85">1</text><text x="78" y="105" font-size="14.5" fill="#4B2A85" font-weight="700">Identify the right person</text><circle cx="52" cy="136" r="2.5" fill="#B8952E"></circle><text x="64" y="140" font-size="12.5" fill="#1F1A26">Know the requirements of the</text><text x="64" y="156" font-size="12.5" fill="#1F1A26">task</text><circle cx="52" cy="176" r="2.5" fill="#B8952E"></circle><text x="64" y="180" font-size="12.5" fill="#1F1A26">Recognise staff strengths and</text><text x="64" y="196" font-size="12.5" fill="#1F1A26">weaknesses</text><circle cx="52" cy="216" r="2.5" fill="#B8952E"></circle><text x="64" y="220" font-size="12.5" fill="#1F1A26">Monitor individual workloads</text><rect x="337" y="66" width="290" height="228" rx="4" fill="#FFFFFF" stroke="#E3DEEA"></rect><rect x="337" y="66" width="290" height="4" fill="#4B2A85"></rect><circle cx="363" cy="100" r="12" fill="#EAE3F4"></circle><text x="363" y="105" text-anchor="middle" font-size="12" font-weight="700" fill="#4B2A85">2</text><text x="385" y="105" font-size="14.5" fill="#4B2A85" font-weight="700">Explain and assign roles</text><circle cx="359" cy="136" r="2.5" fill="#B8952E"></circle><text x="371" y="140" font-size="12.5" fill="#1F1A26">Explain the task, in detail</text><circle cx="359" cy="160" r="2.5" fill="#B8952E"></circle><text x="371" y="164" font-size="12.5" fill="#1F1A26">Agree on who is doing what</text><circle cx="359" cy="184" r="2.5" fill="#B8952E"></circle><text x="371" y="188" font-size="12.5" fill="#1F1A26">Set clear expectations and time</text><text x="371" y="204" font-size="12.5" fill="#1F1A26">frames</text><rect x="644" y="66" width="290" height="228" rx="4" fill="#FFFFFF" stroke="#E3DEEA"></rect><rect x="644" y="66" width="290" height="4" fill="#4B2A85"></rect><circle cx="670" cy="100" r="12" fill="#EAE3F4"></circle><text x="670" y="105" text-anchor="middle" font-size="12" font-weight="700" fill="#4B2A85">3</text><text x="692" y="105" font-size="14.5" fill="#4B2A85" font-weight="700">Develop rapport and a</text><text x="692" y="124" font-size="14.5" fill="#4B2A85" font-weight="700">relationship</text><circle cx="666" cy="155" r="2.5" fill="#B8952E"></circle><text x="678" y="159" font-size="12.5" fill="#1F1A26">Share knowledge, skills and</text><text x="678" y="175" font-size="12.5" fill="#1F1A26">experience</text><circle cx="666" cy="195" r="2.5" fill="#B8952E"></circle><text x="678" y="199" font-size="12.5" fill="#1F1A26">Encourage a problem-solving</text><text x="678" y="215" font-size="12.5" fill="#1F1A26">attitude</text><circle cx="666" cy="235" r="2.5" fill="#B8952E"></circle><text x="678" y="239" font-size="12.5" fill="#1F1A26">Help staff plan and prepare for</text><text x="678" y="255" font-size="12.5" fill="#1F1A26">challenges</text><circle cx="666" cy="275" r="2.5" fill="#B8952E"></circle><text x="678" y="279" font-size="12.5" fill="#1F1A26">Check in with staff to support</text><text x="678" y="295" font-size="12.5" fill="#1F1A26">wellbeing</text><rect x="30" y="316" width="290" height="228" rx="4" fill="#FFFFFF" stroke="#E3DEEA"></rect><rect x="30" y="316" width="290" height="4" fill="#4B2A85"></rect><circle cx="56" cy="350" r="12" fill="#EAE3F4"></circle><text x="56" y="355" text-anchor="middle" font-size="12" font-weight="700" fill="#4B2A85">4</text><text x="78" y="355" font-size="14.5" fill="#4B2A85" font-weight="700">Make time</text><circle cx="52" cy="386" r="2.5" fill="#B8952E"></circle><text x="64" y="390" font-size="12.5" fill="#1F1A26">Block out designated times</text><circle cx="52" cy="410" r="2.5" fill="#B8952E"></circle><text x="64" y="414" font-size="12.5" fill="#1F1A26">Stick to scheduled meetings</text><circle cx="52" cy="434" r="2.5" fill="#B8952E"></circle><text x="64" y="438" font-size="12.5" fill="#1F1A26">Plan ahead and organise your</text><text x="64" y="454" font-size="12.5" fill="#1F1A26">workload</text><rect x="337" y="316" width="290" height="228" rx="4" fill="#FFFFFF" stroke="#E3DEEA"></rect><rect x="337" y="316" width="290" height="4" fill="#4B2A85"></rect><circle cx="363" cy="350" r="12" fill="#EAE3F4"></circle><text x="363" y="355" text-anchor="middle" font-size="12" font-weight="700" fill="#4B2A85">5</text><text x="385" y="355" font-size="14.5" fill="#4B2A85" font-weight="700">Carry out regular file</text><text x="385" y="374" font-size="14.5" fill="#4B2A85" font-weight="700">reviews</text><circle cx="359" cy="405" r="2.5" fill="#B8952E"></circle><text x="371" y="409" font-size="12.5" fill="#1F1A26">Have a file review schedule</text><circle cx="359" cy="429" r="2.5" fill="#B8952E"></circle><text x="371" y="433" font-size="12.5" fill="#1F1A26">Flag and discuss issues; provide</text><text x="371" y="449" font-size="12.5" fill="#1F1A26">constructive feedback</text><circle cx="359" cy="469" r="2.5" fill="#B8952E"></circle><text x="371" y="473" font-size="12.5" fill="#1F1A26">Document and follow up actions</text><rect x="644" y="316" width="290" height="228" rx="4" fill="#FFFFFF" stroke="#E3DEEA"></rect><rect x="644" y="316" width="290" height="4" fill="#4B2A85"></rect><circle cx="670" cy="350" r="12" fill="#EAE3F4"></circle><text x="670" y="355" text-anchor="middle" font-size="12" font-weight="700" fill="#4B2A85">6</text><text x="692" y="355" font-size="14.5" fill="#4B2A85" font-weight="700">Use checklists</text><circle cx="666" cy="386" r="2.5" fill="#B8952E"></circle><text x="678" y="390" font-size="12.5" fill="#1F1A26">Client identification</text><circle cx="666" cy="410" r="2.5" fill="#B8952E"></circle><text x="678" y="414" font-size="12.5" fill="#1F1A26">Conflict of interest</text><circle cx="666" cy="434" r="2.5" fill="#B8952E"></circle><text x="678" y="438" font-size="12.5" fill="#1F1A26">Matter workflow</text><circle cx="666" cy="458" r="2.5" fill="#B8952E"></circle><text x="678" y="462" font-size="12.5" fill="#1F1A26">File closing</text></svg>