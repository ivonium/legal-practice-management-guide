<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" role="img" style="display:block;width:100%;height:auto;font-family:'Source Sans 3',system-ui,sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#4B2A85"></path></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#B8952E"></path></marker></defs>
<text x="30" y="26" font-size="12.5" letter-spacing="1.6" fill="#6B6478">TRUST ACCOUNTING · SECTION 9.2 · COMPANION TO THE METHOD SELECTOR</text><line x1="30" y1="40" x2="930" y2="40" stroke="#B8952E" stroke-width="1"></line>
<rect x="30" y="62" width="216" height="62" rx="3" fill="#4B2A85"></rect><text x="42" y="84" font-size="13.5" fill="#FFFFFF" font-weight="700">1. No authority</text><text x="42" y="115" font-size="12" font-weight="600" fill="#EAE3F4">r 42(3)</text><rect x="30" y="132" width="216" height="72" rx="3" fill="#FFFFFF" stroke="#E3DEEA"></rect><text x="42" y="152" font-size="10.5" letter-spacing="1.1" fill="#6B6478">REQUIREMENT</text><text x="42" y="170" font-size="12.5" fill="#1F1A26">Bill given referring to the</text><text x="42" y="187" font-size="12.5" fill="#1F1A26">proposed withdrawal</text><rect x="30" y="212" width="216" height="194" rx="3" fill="#F5EFDD" stroke="#B8952E"></rect><text x="42" y="232" font-size="10.5" letter-spacing="1.1" fill="#6B6478">WAIT</text><text x="42" y="250" font-size="12.5" fill="#1F1A26" font-weight="600">7 business days with no</text><text x="42" y="266" font-size="12.5" fill="#1F1A26" font-weight="600">objection; or 30 days after</text><text x="42" y="282" font-size="12.5" fill="#1F1A26" font-weight="600">the later of the bill date and</text><text x="42" y="298" font-size="12.5" fill="#1F1A26" font-weight="600">receipt of an itemised bill</text><text x="42" y="314" font-size="12.5" fill="#1F1A26" font-weight="600">where the person objects but</text><text x="42" y="330" font-size="12.5" fill="#1F1A26" font-weight="600">has not referred the matter to</text><text x="42" y="346" font-size="12.5" fill="#1F1A26" font-weight="600">the Commissioner or for</text><text x="42" y="362" font-size="12.5" fill="#1F1A26" font-weight="600">assessment; or the money</text><text x="42" y="378" font-size="12.5" fill="#1F1A26" font-weight="600">otherwise becomes legally</text><text x="42" y="394" font-size="12.5" fill="#1F1A26" font-weight="600">payable</text><rect x="258" y="62" width="216" height="62" rx="3" fill="#4B2A85"></rect><text x="270" y="84" font-size="13.5" fill="#FFFFFF" font-weight="700">2. Instructions received</text><text x="270" y="115" font-size="12" font-weight="600" fill="#EAE3F4">r 42(4)</text><rect x="258" y="132" width="216" height="140" rx="3" fill="#FFFFFF" stroke="#E3DEEA"></rect><text x="270" y="152" font-size="10.5" letter-spacing="1.1" fill="#6B6478">REQUIREMENT</text><text x="270" y="170" font-size="12.5" fill="#1F1A26">Instructions authorising the</text><text x="270" y="187" font-size="12.5" fill="#1F1A26">withdrawal, and before</text><text x="270" y="204" font-size="12.5" fill="#1F1A26">withdrawing, a request for</text><text x="270" y="221" font-size="12.5" fill="#1F1A26">payment referring to the</text><text x="270" y="238" font-size="12.5" fill="#1F1A26">proposed withdrawal or a</text><text x="270" y="255" font-size="12.5" fill="#1F1A26">written notice of withdrawal</text><rect x="258" y="280" width="216" height="50" rx="3" fill="#F5EFDD" stroke="#B8952E"></rect><text x="270" y="300" font-size="10.5" letter-spacing="1.1" fill="#6B6478">WAIT</text><text x="270" y="318" font-size="12.5" fill="#1F1A26" font-weight="600">None</text><rect x="486" y="62" width="216" height="62" rx="3" fill="#4B2A85"></rect><text x="498" y="84" font-size="13.5" fill="#FFFFFF" font-weight="700">3. Reimbursement</text><text x="498" y="115" font-size="12" font-weight="600" fill="#EAE3F4">r 42(5)</text><rect x="486" y="132" width="216" height="140" rx="3" fill="#FFFFFF" stroke="#E3DEEA"></rect><text x="498" y="152" font-size="10.5" letter-spacing="1.1" fill="#6B6478">REQUIREMENT</text><text x="498" y="170" font-size="12.5" fill="#1F1A26">Money owed by way of</text><text x="498" y="187" font-size="12.5" fill="#1F1A26">reimbursement of a</text><text x="498" y="204" font-size="12.5" fill="#1F1A26">disbursement already paid, and</text><text x="498" y="221" font-size="12.5" fill="#1F1A26">a request for payment or</text><text x="498" y="238" font-size="12.5" fill="#1F1A26">written notice of withdrawal</text><text x="498" y="255" font-size="12.5" fill="#1F1A26">sent first</text><rect x="486" y="280" width="216" height="50" rx="3" fill="#F5EFDD" stroke="#B8952E"></rect><text x="498" y="300" font-size="10.5" letter-spacing="1.1" fill="#6B6478">WAIT</text><text x="498" y="318" font-size="12.5" fill="#1F1A26" font-weight="600">None</text><rect x="714" y="62" width="216" height="62" rx="3" fill="#4B2A85"></rect><text x="726" y="84" font-size="13.5" fill="#FFFFFF" font-weight="700">4. Commercial or</text><text x="726" y="101" font-size="13.5" fill="#FFFFFF" font-weight="700">government client</text><text x="726" y="115" font-size="12" font-weight="600" fill="#EAE3F4">r 42(6)</text><rect x="714" y="132" width="216" height="174" rx="3" fill="#FFFFFF" stroke="#E3DEEA"></rect><text x="726" y="152" font-size="10.5" letter-spacing="1.1" fill="#6B6478">REQUIREMENT</text><text x="726" y="170" font-size="12.5" fill="#1F1A26">Bill given specifying the</text><text x="726" y="187" font-size="12.5" fill="#1F1A26">amount; withdrawal in</text><text x="726" y="204" font-size="12.5" fill="#1F1A26">accordance with a compliant</text><text x="726" y="221" font-size="12.5" fill="#1F1A26">costs agreement that</text><text x="726" y="238" font-size="12.5" fill="#1F1A26">authorises the withdrawal; and</text><text x="726" y="255" font-size="12.5" fill="#1F1A26">a request for payment</text><text x="726" y="272" font-size="12.5" fill="#1F1A26">referring to the proposed</text><text x="726" y="289" font-size="12.5" fill="#1F1A26">withdrawal sent first</text><rect x="714" y="314" width="216" height="50" rx="3" fill="#F5EFDD" stroke="#B8952E"></rect><text x="726" y="334" font-size="10.5" letter-spacing="1.1" fill="#6B6478">WAIT</text><text x="726" y="352" font-size="12.5" fill="#1F1A26" font-weight="600">None</text></svg>