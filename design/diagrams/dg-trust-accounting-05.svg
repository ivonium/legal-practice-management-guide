<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 424" role="img" style="display:block;width:100%;height:auto;font-family:'Source Sans 3',system-ui,sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#4B2A85"></path></marker>
<marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#B8952E"></path></marker></defs>
<text x="30" y="26" font-size="12.5" letter-spacing="1.6" fill="#6B6478">TRUST ACCOUNTING · SECTION 6.3</text><line x1="30" y1="40" x2="930" y2="40" stroke="#B8952E" stroke-width="1"></line>
<rect x="30" y="70" width="216" height="290" rx="4" fill="#FFFFFF" stroke="#4B2A85" stroke-width="1.6"></rect><rect x="30" y="70" width="216" height="5" fill="#4B2A85"></rect><text x="46" y="110" font-size="16" fill="#4B2A85" font-weight="700">No intermixing.</text><text x="46" y="139" font-size="13" fill="#1F1A26">Trust money must not be</text><text x="46" y="157" font-size="13" fill="#1F1A26">mixed with other money, in</text><text x="46" y="175" font-size="13" fill="#1F1A26">either direction, except as</text><text x="46" y="193" font-size="13" fill="#1F1A26">authorised by the DLRA</text><text x="46" y="344" font-size="12.5" font-weight="600" fill="#6B6478">s 146</text><rect x="258" y="70" width="216" height="290" rx="4" fill="#FFFFFF" stroke="#4B2A85" stroke-width="1.6"></rect><rect x="258" y="70" width="216" height="5" fill="#4B2A85"></rect><text x="274" y="110" font-size="16" fill="#4B2A85" font-weight="700">No deficiency.</text><text x="274" y="139" font-size="13" fill="#1F1A26">Must not, without</text><text x="274" y="157" font-size="13" fill="#1F1A26">reasonable excuse, cause a</text><text x="274" y="175" font-size="13" fill="#1F1A26">deficiency in any trust</text><text x="274" y="193" font-size="13" fill="#1F1A26">account or trust ledger, or</text><text x="274" y="211" font-size="13" fill="#1F1A26">a failure to pay or deliver</text><text x="274" y="229" font-size="13" fill="#1F1A26">trust money. Penalty: 500</text><text x="274" y="247" font-size="13" fill="#1F1A26">penalty units or 5 years,</text><text x="274" y="265" font-size="13" fill="#1F1A26">or both</text><text x="274" y="344" font-size="12.5" font-weight="600" fill="#6B6478">s 148</text><rect x="486" y="70" width="216" height="290" rx="4" fill="#FFFFFF" stroke="#4B2A85" stroke-width="1.6"></rect><rect x="486" y="70" width="216" height="5" fill="#4B2A85"></rect><text x="502" y="110" font-size="16" fill="#4B2A85" font-weight="700">No false names.</text><text x="502" y="139" font-size="13" fill="#1F1A26">Must not knowingly receive</text><text x="502" y="157" font-size="13" fill="#1F1A26">or record money under a</text><text x="502" y="175" font-size="13" fill="#1F1A26">false name; must record all</text><text x="502" y="193" font-size="13" fill="#1F1A26">names by which a person is</text><text x="502" y="211" font-size="13" fill="#1F1A26">known</text><text x="502" y="344" font-size="12.5" font-weight="600" fill="#6B6478">s 147(3)</text><rect x="714" y="70" width="216" height="290" rx="4" fill="#FFFFFF" stroke="#4B2A85" stroke-width="1.6"></rect><rect x="714" y="70" width="216" height="5" fill="#4B2A85"></rect><text x="730" y="110" font-size="16" fill="#4B2A85" font-weight="700">No borrowing from</text><text x="730" y="131" font-size="16" fill="#4B2A85" font-weight="700">clients,</text><text x="730" y="160" font-size="13" fill="#1F1A26">or assisting an associate</text><text x="730" y="178" font-size="13" fill="#1F1A26">to do so, subject to the</text><text x="730" y="196" font-size="13" fill="#1F1A26">rule’s exemptions</text><text x="730" y="344" font-size="12.5" font-weight="600" fill="#6B6478">ASCR r 12.3</text><text x="30" y="392" font-size="13.5" fill="#6B6478">Trust money is not available for the practice’s debts and is not liable to attachment or execution against the</text><text x="30" y="410" font-size="13.5" fill="#6B6478">practice or an associate (s 145).</text></svg>