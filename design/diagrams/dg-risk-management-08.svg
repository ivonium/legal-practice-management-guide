<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 588" role="img" style="display:block;width:100%;height:auto;font-family:'Source Sans 3',system-ui,sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#4B2A85"></path></marker></defs>
<text x="30" y="26" font-size="12.5" letter-spacing="1.6" fill="#6B6478">RISK MANAGEMENT · SECTION 6.3</text><line x1="30" y1="40" x2="930" y2="40" stroke="#B8952E" stroke-width="1"></line>
<rect x="60" y="70" width="700" height="48" rx="4" fill="#FFFFFF" stroke="#E3DEEA" stroke-width="1"></rect><rect x="34" y="84" width="18" height="18" rx="3" fill="#FFFFFF" stroke="#4B2A85" stroke-width="1.5"></rect><text x="80" y="98" font-size="14" fill="#1F1A26" font-weight="400">Conflict check</text><line x1="43" y1="118" x2="43" y2="130" stroke="#E3DEEA"></line><rect x="60" y="130" width="700" height="48" rx="4" fill="#FFFFFF" stroke="#E3DEEA" stroke-width="1"></rect><rect x="34" y="144" width="18" height="18" rx="3" fill="#FFFFFF" stroke="#4B2A85" stroke-width="1.5"></rect><text x="80" y="158" font-size="14" fill="#1F1A26" font-weight="400">Review the file to confirm you have sufficient resources and people available</text><line x1="43" y1="178" x2="43" y2="190" stroke="#E3DEEA"></line><rect x="60" y="190" width="700" height="62" rx="4" fill="#FFFFFF" stroke="#E3DEEA" stroke-width="1"></rect><rect x="34" y="204" width="18" height="18" rx="3" fill="#FFFFFF" stroke="#4B2A85" stroke-width="1.5"></rect><text x="80" y="218" font-size="14" fill="#1F1A26" font-weight="400">Confirm you have the whole file - there may be a lien over it with the</text><text x="80" y="236" font-size="14" fill="#1F1A26" font-weight="400">previous firm</text><line x1="43" y1="252" x2="43" y2="264" stroke="#E3DEEA"></line><rect x="60" y="264" width="700" height="48" rx="4" fill="#FFFFFF" stroke="#E3DEEA" stroke-width="1"></rect><rect x="34" y="278" width="18" height="18" rx="3" fill="#FFFFFF" stroke="#4B2A85" stroke-width="1.5"></rect><text x="80" y="292" font-size="14" fill="#1F1A26" font-weight="400">Assess the quality of the file</text><line x1="43" y1="312" x2="43" y2="324" stroke="#E3DEEA"></line><rect x="60" y="324" width="700" height="62" rx="4" fill="#FFFFFF" stroke="#E3DEEA" stroke-width="1"></rect><rect x="34" y="338" width="18" height="18" rx="3" fill="#FFFFFF" stroke="#4B2A85" stroke-width="1.5"></rect><text x="80" y="352" font-size="14" fill="#1F1A26" font-weight="400">Explain that you must review the work done in its entirety. You cannot pick up</text><text x="80" y="370" font-size="14" fill="#1F1A26" font-weight="400">at the letter L and rely on the previous firm for A through K</text><line x1="43" y1="386" x2="43" y2="398" stroke="#E3DEEA"></line><rect x="60" y="398" width="700" height="48" rx="4" fill="#FFFFFF" stroke="#E3DEEA" stroke-width="1"></rect><rect x="34" y="412" width="18" height="18" rx="3" fill="#FFFFFF" stroke="#4B2A85" stroke-width="1.5"></rect><text x="80" y="426" font-size="14" fill="#1F1A26" font-weight="400">Ask about objectives and expectations afresh</text><line x1="43" y1="446" x2="43" y2="458" stroke="#E3DEEA"></line><rect x="60" y="458" width="700" height="48" rx="4" fill="#FFFFFF" stroke="#E3DEEA" stroke-width="1"></rect><rect x="34" y="472" width="18" height="18" rx="3" fill="#FFFFFF" stroke="#4B2A85" stroke-width="1.5"></rect><text x="80" y="486" font-size="14" fill="#1F1A26" font-weight="400">Ask whether they saw anyone before that firm</text><line x1="43" y1="506" x2="43" y2="518" stroke="#E3DEEA"></line><rect x="60" y="518" width="700" height="48" rx="4" fill="#F5EFDD" stroke="#B8952E" stroke-width="1.6"></rect><circle cx="43" cy="541" r="11" fill="#B8952E"></circle><text x="80" y="546" font-size="14" fill="#1F1A26" font-weight="700">If the answer is yes, you are the third firm, and you should think hard</text></svg>