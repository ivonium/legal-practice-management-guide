<rect x="30" y="62" width="900" height="30" rx="3" fill="#4B2A85"></rect><text x="48" y="82" font-size="13.5" font-weight="700" fill="#FFFFFF">Uniform Law (NSW) as applied by Application Act s 4</text><g data-hover="data-hover"><g><rect x="30" y="100" width="900" height="66" rx="3" fill="#FFFFFF" stroke="#E3DEEA"></rect><rect x="30" y="100" width="4" height="66" fill="#4B2A85"></rect><text x="48" y="124" font-size="14" fill="#4B2A85" font-weight="700">LPUL Ch 4 Pt 4.2, ss 127-168</text><text x="48" y="142" font-size="13" fill="#1F1A26">Substantive obligations: definitions, deposit, holding, disbursement,</text><text x="48" y="159" font-size="13" fill="#1F1A26">records, examinations, investigations</text></g><g><rect x="44" y="174" width="886" height="66" rx="3" fill="#F4F1F8" stroke="#E3DEEA"></rect><rect x="44" y="174" width="4" height="66" fill="#4B2A85"></rect><text x="62" y="198" font-size="14" fill="#4B2A85" font-weight="700">LPUGR Ch 4 Pt 4.2, rr 33-69</text><text x="62" y="216" font-size="13" fill="#1F1A26">Record-keeping detail: which records, what information, which reports, by</text><text x="62" y="233" font-size="13" fill="#1F1A26">when</text></g><g><rect x="58" y="248" width="872" height="66" rx="3" fill="#FFFFFF" stroke="#E3DEEA"></rect><rect x="58" y="248" width="4" height="66" fill="#4B2A85"></rect><text x="76" y="272" font-size="14" fill="#4B2A85" font-weight="700">LPUGR Pt 4.6, rr 91E-95A</text><text x="76" y="290" font-size="13" fill="#1F1A26">File opening and the three practice registers. Applies to all law</text><text x="76" y="307" font-size="13" fill="#1F1A26">practices, trust money or not</text></g><g><rect x="72" y="322" width="858" height="52" rx="3" fill="#F4F1F8" stroke="#E3DEEA"></rect><rect x="72" y="322" width="4" height="52" fill="#B8952E"></rect><text x="90" y="346" font-size="14" fill="#4B2A85" font-weight="700">Application Act ss 11, 14, 46-47</text><text x="90" y="364" font-size="13" fill="#1F1A26">Law Society Council as DLRA; unclaimed money; statutory deposits</text></g><g><rect x="86" y="382" width="844" height="52" rx="3" fill="#FFFFFF" stroke="#E3DEEA"></rect><rect x="86" y="382" width="4" height="52" fill="#B8952E"></rect><text x="104" y="406" font-size="14" fill="#4B2A85" font-weight="700">Application Regulation Pt 3</text><text x="104" y="424" font-size="13" fill="#1F1A26">Statutory deposit calculation, timing, administration</text></g><g><rect x="100" y="442" width="830" height="52" rx="3" fill="#F4F1F8" stroke="#E3DEEA"></rect><rect x="100" y="442" width="4" height="52" fill="#B8952E"></rect><text x="118" y="466" font-size="14" fill="#4B2A85" font-weight="700">ASCR rr 12.3, 37</text><text x="118" y="484" font-size="13" fill="#1F1A26">Borrowing from clients; reasonable supervision</text></g><g><rect x="114" y="502" width="816" height="52" rx="3" fill="#FFFFFF" stroke="#E3DEEA"></rect><rect x="114" y="502" width="4" height="52" fill="#B8952E"></rect><text x="132" y="526" font-size="14" fill="#4B2A85" font-weight="700">Solicitors Rules r 6</text><text x="132" y="544" font-size="13" fill="#1F1A26">Transfer of a practice, including files and trust money</text></g></g></svg>