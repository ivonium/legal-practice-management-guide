<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 496" role="img" style="display:block;width:100%;height:auto;font-family:'Source Sans 3',system-ui,sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#4B2A85"></path></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#B8952E"></path></marker></defs>
<text x="30" y="26" font-size="12.5" letter-spacing="1.6" fill="#6B6478">PRACTICE MANAGEMENT · SECTIONS 7.3 AND 7.4</text><line x1="30" y1="40" x2="930" y2="40" stroke="#B8952E" stroke-width="1"></line>
<rect x="30" y="72" width="520" height="72" rx="4" fill="#FFFFFF" stroke="#4B2A85" stroke-width="1.3"></rect><circle cx="66" cy="108" r="18" fill="#4B2A85"></circle><text x="66" y="114" text-anchor="middle" font-size="16" font-weight="700" fill="#FFFFFF">A</text><text x="100" y="114" font-size="16" fill="#1F1A26" font-weight="600">Where are you today?</text><line x1="66" y1="144" x2="66" y2="160" stroke="#4B2A85" marker-end="url(#a)"></line><rect x="30" y="160" width="520" height="72" rx="4" fill="#FFFFFF" stroke="#4B2A85" stroke-width="1.3"></rect><circle cx="66" cy="196" r="18" fill="#4B2A85"></circle><text x="66" y="202" text-anchor="middle" font-size="16" font-weight="700" fill="#FFFFFF">B</text><text x="100" y="202" font-size="16" fill="#1F1A26" font-weight="600">Where do you want to be in 12 months?</text><line x1="66" y1="232" x2="66" y2="248" stroke="#4B2A85" marker-end="url(#a)"></line><rect x="30" y="248" width="520" height="72" rx="4" fill="#FFFFFF" stroke="#4B2A85" stroke-width="1.3"></rect><circle cx="66" cy="284" r="18" fill="#4B2A85"></circle><text x="66" y="290" text-anchor="middle" font-size="16" font-weight="700" fill="#FFFFFF">C</text><text x="100" y="290" font-size="16" fill="#1F1A26" font-weight="600">What strategies get you from A to B?</text><line x1="66" y1="320" x2="66" y2="336" stroke="#4B2A85" marker-end="url(#a)"></line><rect x="30" y="336" width="520" height="72" rx="4" fill="#FFFFFF" stroke="#4B2A85" stroke-width="1.3"></rect><circle cx="66" cy="372" r="18" fill="#4B2A85"></circle><text x="66" y="378" text-anchor="middle" font-size="16" font-weight="700" fill="#FFFFFF">D</text><text x="100" y="378" font-size="16" fill="#1F1A26" font-weight="600">What actions sit under each strategy?</text><text x="590" y="60" font-size="12.5" letter-spacing="1.3" fill="#6B6478">KEY RESULT OBJECTIVES · SECTION 7.4</text><rect x="590" y="72" width="340" height="108" rx="4" fill="#EAE3F4" stroke="#4B2A85"></rect><text x="606" y="102" font-size="15.5" fill="#4B2A85" font-weight="700">Service mix</text><text x="606" y="126" font-size="12.5" fill="#1F1A26">What work do you do? Commercial,</text><text x="606" y="142" font-size="12.5" fill="#1F1A26">disputes, insurance, family, estates?</text><text x="606" y="158" font-size="12.5" fill="#1F1A26">What proportion of each?</text><rect x="602" y="196" width="328" height="108" rx="4" fill="#FFFFFF" stroke="#4B2A85"></rect><text x="618" y="226" font-size="15.5" fill="#4B2A85" font-weight="700">Client mix</text><text x="618" y="250" font-size="12.5" fill="#1F1A26">Business, individual, government?</text><text x="618" y="266" font-size="12.5" fill="#1F1A26">Listed companies have very different</text><text x="618" y="282" font-size="12.5" fill="#1F1A26">needs to consumers</text><rect x="614" y="320" width="316" height="108" rx="4" fill="#FFFFFF" stroke="#4B2A85"></rect><text x="630" y="350" font-size="15.5" fill="#4B2A85" font-weight="700">Practice mix</text><text x="630" y="374" font-size="12.5" fill="#1F1A26">Fees budget; accounts receivable days;</text><text x="630" y="390" font-size="12.5" fill="#1F1A26">fees introduced; client growth;</text><text x="630" y="406" font-size="12.5" fill="#1F1A26">introduced fees versus supervised</text><text x="630" y="422" font-size="12.5" fill="#1F1A26">fees; profitability by segment</text><text x="30" y="452" font-size="14" fill="#1F1A26" font-weight="600">Pick only three or four strategies. Plans fail from overload, not from underambition. Map where you are now, map where</text><text x="30" y="470" font-size="14" fill="#1F1A26" font-weight="600">you want to be, and the gap is the plan.</text></svg>