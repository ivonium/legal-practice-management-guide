<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 490" role="img" style="display:block;width:100%;height:auto;font-family:'Source Sans 3',system-ui,sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#4B2A85"></path></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#B8952E"></path></marker></defs>
<text x="30" y="26" font-size="12.5" letter-spacing="1.6" fill="#6B6478">PRACTICE MANAGEMENT · SECTION 9.6 · A SEQUENCE, NOT A MENU</text><line x1="30" y1="40" x2="930" y2="40" stroke="#B8952E" stroke-width="1"></line>
<rect x="30" y="66" width="216" height="300" rx="4" fill="#FFFFFF" stroke="#4B2A85" stroke-width="1.3"></rect><rect x="30" y="66" width="216" height="56" fill="#4B2A85"></rect><text x="44" y="92" font-size="14.5" fill="#FFFFFF" font-weight="700">1. Strategy</text><text x="44" y="150" font-size="10.5" letter-spacing="1.1" fill="#6B6478">QUESTION</text><text x="44" y="170" font-size="12.5" fill="#1F1A26">WHERE will I play? HOW</text><text x="44" y="186" font-size="12.5" fill="#1F1A26">will I compete? WHY will I</text><text x="44" y="202" font-size="12.5" fill="#1F1A26">win?</text><text x="44" y="300" font-size="10.5" letter-spacing="1.1" fill="#6B6478">OUTCOME</text><text x="44" y="326" font-size="16" fill="#4B2A85" font-weight="700">FOCUS</text><rect x="258" y="66" width="216" height="300" rx="4" fill="#FFFFFF" stroke="#4B2A85" stroke-width="1.3"></rect><rect x="258" y="66" width="216" height="56" fill="#4B2A85"></rect><text x="272" y="92" font-size="14.5" fill="#FFFFFF" font-weight="700">2. Marketing</text><text x="272" y="150" font-size="10.5" letter-spacing="1.1" fill="#6B6478">QUESTION</text><text x="272" y="170" font-size="12.5" fill="#1F1A26">AWARENESS (web, social,</text><text x="272" y="186" font-size="12.5" fill="#1F1A26">media); UNDERSTANDING</text><text x="272" y="202" font-size="12.5" fill="#1F1A26">(articles, industry</text><text x="272" y="218" font-size="12.5" fill="#1F1A26">engagement); CONSIDERATION</text><text x="272" y="234" font-size="12.5" fill="#1F1A26">and BELIEF (one to one,</text><text x="272" y="250" font-size="12.5" fill="#1F1A26">evidence)</text><text x="272" y="300" font-size="10.5" letter-spacing="1.1" fill="#6B6478">OUTCOME</text><text x="272" y="326" font-size="16" fill="#4B2A85" font-weight="700">AWARE</text><rect x="486" y="66" width="216" height="300" rx="4" fill="#FFFFFF" stroke="#4B2A85" stroke-width="1.3"></rect><rect x="486" y="66" width="216" height="56" fill="#4B2A85"></rect><text x="500" y="92" font-size="14.5" fill="#FFFFFF" font-weight="700">3. Business</text><text x="500" y="110" font-size="14.5" fill="#FFFFFF" font-weight="700">development</text><text x="500" y="150" font-size="10.5" letter-spacing="1.1" fill="#6B6478">QUESTION</text><text x="500" y="170" font-size="12.5" fill="#1F1A26">Triggers and filters;</text><text x="500" y="186" font-size="12.5" fill="#1F1A26">discussion; scope / price</text><text x="500" y="202" font-size="12.5" fill="#1F1A26">/ pitch; go / no go</text><text x="500" y="300" font-size="10.5" letter-spacing="1.1" fill="#6B6478">OUTCOME</text><text x="500" y="326" font-size="16" fill="#4B2A85" font-weight="700">INSTRUCT</text><rect x="714" y="66" width="216" height="300" rx="4" fill="#FFFFFF" stroke="#4B2A85" stroke-width="1.3"></rect><rect x="714" y="66" width="216" height="56" fill="#4B2A85"></rect><text x="728" y="92" font-size="14.5" fill="#FFFFFF" font-weight="700">4. Client experience</text><text x="728" y="110" font-size="14.5" fill="#FFFFFF" font-weight="700">management</text><text x="728" y="150" font-size="10.5" letter-spacing="1.1" fill="#6B6478">QUESTION</text><text x="728" y="170" font-size="12.5" fill="#1F1A26">Enter; engage; exit</text><text x="728" y="300" font-size="10.5" letter-spacing="1.1" fill="#6B6478">OUTCOME</text><text x="728" y="326" font-size="16" fill="#4B2A85" font-weight="700">Extend and defend</text><line x1="30" y1="392" x2="930" y2="392" stroke="#B8952E"></line><text x="30" y="418" font-size="13.5" fill="#1F1A26">Marketing is one to many. It is messaging and positioning. Its purpose is to create demand so that demand comes to you.</text><text x="30" y="436" font-size="13.5" fill="#1F1A26">Business development is one to one. It is the connection piece: meeting people, shaking hands, targeting a specific company</text><text x="30" y="454" font-size="13.5" fill="#1F1A26">or person, turning that into an ongoing relationship.</text></svg>