<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 390" role="img" style="display:block;width:100%;height:auto;font-family:'Source Sans 3',system-ui,sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#4B2A85"></path></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#B8952E"></path></marker></defs>
<text x="30" y="26" font-size="12.5" letter-spacing="1.6" fill="#6B6478">PRACTICE MANAGEMENT · SECTION 3.1 · COMPANION TO THE CALCULATOR</text><line x1="30" y1="40" x2="930" y2="40" stroke="#B8952E" stroke-width="1"></line>
<rect x="30" y="66" width="288" height="250" rx="4" fill="#FFFFFF" stroke="#E3DEEA" stroke-width="1"></rect><rect x="30" y="66" width="288" height="4" fill="#4B2A85"></rect><text x="48" y="104" font-size="17" fill="#4B2A85" font-weight="700">Work harder</text><text x="48" y="152" font-size="13" fill="#1F1A26">Bill another 85 hours. At 60%</text><text x="48" y="169" font-size="13" fill="#1F1A26">chargeable, that is 142 extra</text><text x="48" y="186" font-size="13" fill="#1F1A26">hours, about 18 days</text><text x="48" y="286" font-size="24" font-weight="700" fill="#4B2A85">18 days</text><rect x="336" y="66" width="288" height="250" rx="4" fill="#FFFFFF" stroke="#E3DEEA" stroke-width="1"></rect><rect x="336" y="66" width="288" height="4" fill="#4B2A85"></rect><text x="354" y="104" font-size="17" fill="#4B2A85" font-weight="700">Add resources</text><text x="354" y="152" font-size="13" fill="#1F1A26">At a 30% margin, render another</text><text x="354" y="169" font-size="13" fill="#1F1A26">$100,000. At $350/hour and 60%</text><text x="354" y="186" font-size="13" fill="#1F1A26">chargeable, about 476 person</text><text x="354" y="203" font-size="13" fill="#1F1A26">hours, or 60 days</text><text x="354" y="286" font-size="24" font-weight="700" fill="#4B2A85">60 days</text><rect x="642" y="66" width="288" height="250" rx="4" fill="#F5EFDD" stroke="#B8952E" stroke-width="1.7"></rect><rect x="642" y="66" width="288" height="4" fill="#B8952E"></rect><text x="660" y="104" font-size="17" fill="#4B2A85" font-weight="700">Raise price 8.5%</text><text x="660" y="152" font-size="13" fill="#1F1A26">Charge $380 instead of $350.</text><text x="660" y="169" font-size="13" fill="#1F1A26">Expenses unchanged. Same $30,000</text><text x="660" y="286" font-size="24" font-weight="700" fill="#B8952E">no extra days</text><text x="30" y="352" font-size="14" fill="#1F1A26" font-weight="600">A practitioner wants $30,000 more profit. A lawyer rendering $350,000 a year on 1,000 billed hours could take any of</text><text x="30" y="370" font-size="14" fill="#1F1A26" font-weight="600">these routes. Price is overwhelmingly the cheapest lever.</text></svg>