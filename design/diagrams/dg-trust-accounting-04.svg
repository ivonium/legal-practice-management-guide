<text x="30" y="26" font-size="12.5" letter-spacing="1.6" fill="#6B6478">TRUST ACCOUNTING · SECTION 5</text><line x1="30" y1="40" x2="930" y2="40" stroke="#B8952E" stroke-width="1"></line>
<text x="30" y="148" font-size="12" letter-spacing="1.1" fill="#6B6478">WHAT TRIGGERS IT</text><text x="30" y="297" font-size="12" letter-spacing="1.1" fill="#6B6478">WHAT YOU MUST DO</text><text x="30" y="476" font-size="12" letter-spacing="1.1" fill="#6B6478">RECORDS</text><text x="30" y="550" font-size="12" letter-spacing="1.1" fill="#6B6478">STATEMENT REQUIRED?</text><g data-tabs="data-tabs"><g data-tab="General"><rect x="30.0" y="92" width="143.3" height="56" rx="3" fill="#4B2A85"></rect><text x="40" y="114" font-size="12.5" fill="#FFFFFF" font-weight="700">General trust</text><text x="40" y="130" font-size="12.5" fill="#FFFFFF" font-weight="700">money</text><rect x="30.0" y="156" width="143.3" height="123" rx="3" fill="#FFFFFF" stroke="#E3DEEA"></rect><text x="40" y="174" font-size="11.5" fill="#1F1A26" font-weight="400">Default position</text><rect x="30.0" y="305" width="143.3" height="153" rx="3" fill="#F4F1F8" stroke="#E3DEEA"></rect><text x="40" y="323" font-size="11.5" fill="#1F1A26" font-weight="400">Deposit to the GTA</text><text x="40" y="338" font-size="11.5" fill="#1F1A26" font-weight="400">at an authorised ADI</text><text x="40" y="353" font-size="11.5" fill="#1F1A26" font-weight="400">in NSW as soon as</text><text x="40" y="368" font-size="11.5" fill="#1F1A26" font-weight="400">practicable (s 137,</text><text x="40" y="383" font-size="11.5" fill="#1F1A26" font-weight="400">s 136). Hold</text><text x="40" y="398" font-size="11.5" fill="#1F1A26" font-weight="400">exclusively for the</text><text x="40" y="413" font-size="11.5" fill="#1F1A26" font-weight="400">person; disburse</text><text x="40" y="428" font-size="11.5" fill="#1F1A26" font-weight="400">only on their</text><text x="40" y="443" font-size="11.5" fill="#1F1A26" font-weight="400">direction (s 138)</text><rect x="30.0" y="484" width="143.3" height="48" rx="3" fill="#FFFFFF" stroke="#E3DEEA"></rect><text x="40" y="502" font-size="11.5" fill="#1F1A26" font-weight="400">rr 36-49</text><rect x="30.0" y="558" width="143.3" height="33" rx="3" fill="#F4F1F8" stroke="#E3DEEA"></rect><text x="40" y="576" font-size="11.5" fill="#1F1A26" font-weight="700">Yes</text></g><g data-tab="Controlled"><rect x="181.3" y="92" width="143.3" height="56" rx="3" fill="#4B2A85"></rect><text x="191.33333333333334" y="114" font-size="12.5" fill="#FFFFFF" font-weight="700">Controlled money</text><rect x="181.3" y="156" width="143.3" height="123" rx="3" fill="#FFFFFF" stroke="#E3DEEA"></rect><text x="191.33333333333334" y="174" font-size="11.5" fill="#1F1A26" font-weight="400">Written direction to</text><text x="191.33333333333334" y="189" font-size="11.5" fill="#1F1A26" font-weight="400">deposit into a</text><text x="191.33333333333334" y="204" font-size="11.5" fill="#1F1A26" font-weight="400">non-GTA account</text><text x="191.33333333333334" y="219" font-size="11.5" fill="#1F1A26" font-weight="400">under the practice’s</text><text x="191.33333333333334" y="234" font-size="11.5" fill="#1F1A26" font-weight="400">exclusive control</text><rect x="181.3" y="305" width="143.3" height="153" rx="3" fill="#F4F1F8" stroke="#E3DEEA"></rect><text x="191.33333333333334" y="323" font-size="11.5" fill="#1F1A26" font-weight="400">Deposit as soon as</text><text x="191.33333333333334" y="338" font-size="11.5" fill="#1F1A26" font-weight="400">practicable into the</text><text x="191.33333333333334" y="353" font-size="11.5" fill="#1F1A26" font-weight="400">account specified.</text><text x="191.33333333333334" y="368" font-size="11.5" fill="#1F1A26" font-weight="400">No pooling (s 139)</text><rect x="181.3" y="484" width="143.3" height="48" rx="3" fill="#FFFFFF" stroke="#E3DEEA"></rect><text x="191.33333333333334" y="502" font-size="11.5" fill="#1F1A26" font-weight="400">rr 61-64</text><rect x="181.3" y="558" width="143.3" height="33" rx="3" fill="#F4F1F8" stroke="#E3DEEA"></rect><text x="191.33333333333334" y="576" font-size="11.5" fill="#1F1A26" font-weight="700">Yes</text></g><g data-tab="Transit"><rect x="332.7" y="92" width="143.3" height="56" rx="3" fill="#4B2A85"></rect><text x="342.6666666666667" y="114" font-size="12.5" fill="#FFFFFF" font-weight="700">Transit money</text><rect x="332.7" y="156" width="143.3" height="123" rx="3" fill="#FFFFFF" stroke="#E3DEEA"></rect><text x="342.6666666666667" y="174" font-size="11.5" fill="#1F1A26" font-weight="400">Instructions to pay</text><text x="342.6666666666667" y="189" font-size="11.5" fill="#1F1A26" font-weight="400">or deliver to a</text><text x="342.6666666666667" y="204" font-size="11.5" fill="#1F1A26" font-weight="400">third party who is</text><text x="342.6666666666667" y="219" font-size="11.5" fill="#1F1A26" font-weight="400">not an associate</text><rect x="332.7" y="305" width="143.3" height="153" rx="3" fill="#F4F1F8" stroke="#E3DEEA"></rect><text x="342.6666666666667" y="323" font-size="11.5" fill="#1F1A26" font-weight="400">Pay or deliver</text><text x="342.6666666666667" y="338" font-size="11.5" fill="#1F1A26" font-weight="400">within the period</text><text x="342.6666666666667" y="353" font-size="11.5" fill="#1F1A26" font-weight="400">specified, else as</text><text x="342.6666666666667" y="368" font-size="11.5" fill="#1F1A26" font-weight="400">soon as practicable</text><text x="342.6666666666667" y="383" font-size="11.5" fill="#1F1A26" font-weight="400">(s 140(1))</text><rect x="332.7" y="484" width="143.3" height="48" rx="3" fill="#FFFFFF" stroke="#E3DEEA"></rect><text x="342.6666666666667" y="502" font-size="11.5" fill="#1F1A26" font-weight="400">Brief particulars, 7</text><text x="342.6666666666667" y="517" font-size="11.5" fill="#1F1A26" font-weight="400">years (s 140(2)-(3))</text><rect x="332.7" y="558" width="143.3" height="33" rx="3" fill="#F4F1F8" stroke="#E3DEEA"></rect><text x="342.6666666666667" y="576" font-size="11.5" fill="#1F1A26" font-weight="700">No</text></g><g data-tab="Written direction"><rect x="484.0" y="92" width="143.3" height="56" rx="3" fill="#4B2A85"></rect><text x="494" y="114" font-size="12.5" fill="#FFFFFF" font-weight="700">Written direction</text><text x="494" y="130" font-size="12.5" fill="#FFFFFF" font-weight="700">money</text><rect x="484.0" y="156" width="143.3" height="123" rx="3" fill="#FFFFFF" stroke="#E3DEEA"></rect><text x="494" y="174" font-size="11.5" fill="#1F1A26" font-weight="400">Written direction</text><text x="494" y="189" font-size="11.5" fill="#1F1A26" font-weight="400">from a person</text><text x="494" y="204" font-size="11.5" fill="#1F1A26" font-weight="400">legally entitled, to</text><text x="494" y="219" font-size="11.5" fill="#1F1A26" font-weight="400">deal otherwise than</text><text x="494" y="234" font-size="11.5" fill="#1F1A26" font-weight="400">by GTA deposit</text><rect x="484.0" y="305" width="143.3" height="153" rx="3" fill="#F4F1F8" stroke="#E3DEEA"></rect><text x="494" y="323" font-size="11.5" fill="#1F1A26" font-weight="400">Comply within the</text><text x="494" y="338" font-size="11.5" fill="#1F1A26" font-weight="400">period specified,</text><text x="494" y="353" font-size="11.5" fill="#1F1A26" font-weight="400">else as soon as</text><text x="494" y="368" font-size="11.5" fill="#1F1A26" font-weight="400">practicable (s 142)</text><rect x="484.0" y="484" width="143.3" height="48" rx="3" fill="#FFFFFF" stroke="#E3DEEA"></rect><text x="494" y="502" font-size="11.5" fill="#1F1A26" font-weight="400">Keep the direction 7</text><text x="494" y="517" font-size="11.5" fill="#1F1A26" font-weight="400">years</text><rect x="484.0" y="558" width="143.3" height="33" rx="3" fill="#F4F1F8" stroke="#E3DEEA"></rect><text x="494" y="576" font-size="11.5" fill="#1F1A26" font-weight="700">No</text></g><g data-tab="Power"><rect x="635.3" y="92" width="143.3" height="56" rx="3" fill="#4B2A85"></rect><text x="645.3333333333334" y="114" font-size="12.5" fill="#FFFFFF" font-weight="700">Power money</text><rect x="635.3" y="156" width="143.3" height="123" rx="3" fill="#FFFFFF" stroke="#E3DEEA"></rect><text x="645.3333333333334" y="174" font-size="11.5" fill="#1F1A26" font-weight="400">Power or authority</text><text x="645.3333333333334" y="189" font-size="11.5" fill="#1F1A26" font-weight="400">to deal with money</text><text x="645.3333333333334" y="204" font-size="11.5" fill="#1F1A26" font-weight="400">for another (POA,</text><text x="645.3333333333334" y="219" font-size="11.5" fill="#1F1A26" font-weight="400">probate,</text><text x="645.3333333333334" y="234" font-size="11.5" fill="#1F1A26" font-weight="400">guardianship,</text><text x="645.3333333333334" y="249" font-size="11.5" fill="#1F1A26" font-weight="400">account signing</text><text x="645.3333333333334" y="264" font-size="11.5" fill="#1F1A26" font-weight="400">authority)</text><rect x="635.3" y="305" width="143.3" height="153" rx="3" fill="#F4F1F8" stroke="#E3DEEA"></rect><text x="645.3333333333334" y="323" font-size="11.5" fill="#1F1A26" font-weight="400">Deal only in</text><text x="645.3333333333334" y="338" font-size="11.5" fill="#1F1A26" font-weight="400">accordance with the</text><text x="645.3333333333334" y="353" font-size="11.5" fill="#1F1A26" font-weight="400">power (s 141)</text><rect x="635.3" y="484" width="143.3" height="48" rx="3" fill="#FFFFFF" stroke="#E3DEEA"></rect><text x="645.3333333333334" y="502" font-size="11.5" fill="#1F1A26" font-weight="400">rr 55, 60</text><rect x="635.3" y="558" width="143.3" height="33" rx="3" fill="#F4F1F8" stroke="#E3DEEA"></rect><text x="645.3333333333334" y="576" font-size="11.5" fill="#1F1A26" font-weight="700">Yes</text></g><g data-tab="Investment"><rect x="786.7" y="92" width="143.3" height="56" rx="3" fill="#4B2A85"></rect><text x="796.6666666666667" y="114" font-size="12.5" fill="#FFFFFF" font-weight="700">Investment of</text><text x="796.6666666666667" y="130" font-size="12.5" fill="#FFFFFF" font-weight="700">trust money</text><rect x="786.7" y="156" width="143.3" height="123" rx="3" fill="#FFFFFF" stroke="#E3DEEA"></rect><text x="796.6666666666667" y="174" font-size="11.5" fill="#1F1A26" font-weight="400">Direction to invest,</text><text x="796.6666666666667" y="189" font-size="11.5" fill="#1F1A26" font-weight="400">meeting the s</text><text x="796.6666666666667" y="204" font-size="11.5" fill="#1F1A26" font-weight="400">129(2)(d) test</text><rect x="786.7" y="305" width="143.3" height="153" rx="3" fill="#F4F1F8" stroke="#E3DEEA"></rect><text x="796.6666666666667" y="323" font-size="11.5" fill="#1F1A26" font-weight="400">Invest per the</text><text x="796.6666666666667" y="338" font-size="11.5" fill="#1F1A26" font-weight="400">direction</text><rect x="786.7" y="484" width="143.3" height="48" rx="3" fill="#FFFFFF" stroke="#E3DEEA"></rect><text x="796.6666666666667" y="502" font-size="11.5" fill="#1F1A26" font-weight="400">r 59</text><rect x="786.7" y="558" width="143.3" height="33" rx="3" fill="#F4F1F8" stroke="#E3DEEA"></rect><text x="796.6666666666667" y="576" font-size="11.5" fill="#1F1A26" font-weight="700">Yes</text></g></g><line x1="30" y1="611" x2="930" y2="611" stroke="#B8952E"></line><text x="30" y="637" font-size="13.5" fill="#1F1A26" font-weight="600">The cash rule: all trust money received as cash goes into the GTA first (or the CMA, for controlled money), before being dealt with in any</text><text x="30" y="655" font-size="13.5" fill="#1F1A26" font-weight="600">other way, regardless of anything to the contrary in the direction or instructions (s 143).</text></svg>