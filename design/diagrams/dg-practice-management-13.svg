<text x="30" y="26" font-size="12.5" letter-spacing="1.6" fill="#6B6478">PRACTICE MANAGEMENT · SECTION 7.5</text><line x1="30" y1="40" x2="930" y2="40" stroke="#B8952E" stroke-width="1"></line>
<path d="M30 330 C 230 330 370 250 630 250" fill="none" stroke="#4B2A85" stroke-width="2.4"></path><text x="640" y="255" font-size="13" font-weight="700" fill="#4B2A85">H1</text><path d="M70 330 C 270 330 410 180 670 180" fill="none" stroke="#7B5CB8" stroke-width="2.4"></path><text x="680" y="185" font-size="13" font-weight="700" fill="#4B2A85">H2</text><path d="M110 330 C 310 330 450 110 710 110" fill="none" stroke="#B8952E" stroke-width="2.4"></path><text x="720" y="115" font-size="13" font-weight="700" fill="#B8952E">H3</text><line x1="30" y1="330" x2="930" y2="330" stroke="#E3DEEA"></line><rect x="30" y="360" width="288" height="150" rx="4" fill="#FFFFFF" stroke="#E3DEEA"></rect><rect x="30" y="360" width="288" height="4" fill="#4B2A85"></rect><text x="46" y="392" font-size="14" fill="#4B2A85" font-weight="700">Horizon 1 - operators extend</text><text x="46" y="410" font-size="14" fill="#4B2A85" font-weight="700">the core</text><text x="46" y="448" font-size="12.5" font-weight="700" fill="#B8952E">0 to 12 months</text><text x="46" y="470" font-size="12.5" fill="#1F1A26">Set up the technology; find</text><text x="46" y="486" font-size="12.5" fill="#1F1A26">clients; build the website;</text><text x="46" y="502" font-size="12.5" fill="#1F1A26">update collateral to reflect a</text><text x="46" y="518" font-size="12.5" fill="#1F1A26">new position</text><rect x="336" y="360" width="288" height="150" rx="4" fill="#FFFFFF" stroke="#E3DEEA"></rect><rect x="336" y="360" width="288" height="4" fill="#4B2A85"></rect><text x="352" y="392" font-size="14" fill="#4B2A85" font-weight="700">Horizon 2 - business</text><text x="352" y="410" font-size="14" fill="#4B2A85" font-weight="700">builders develop new</text><text x="352" y="428" font-size="14" fill="#4B2A85" font-weight="700">opportunities</text><text x="352" y="448" font-size="12.5" font-weight="700" fill="#B8952E">1 to 5 years</text><text x="352" y="470" font-size="12.5" fill="#1F1A26">Build a referral network or</text><text x="352" y="486" font-size="12.5" fill="#1F1A26">business association</text><text x="352" y="502" font-size="12.5" fill="#1F1A26">relationship; enter an adjacent</text><text x="352" y="518" font-size="12.5" fill="#1F1A26">service area</text><rect x="642" y="360" width="288" height="150" rx="4" fill="#FFFFFF" stroke="#E3DEEA"></rect><rect x="642" y="360" width="288" height="4" fill="#B8952E"></rect><text x="658" y="392" font-size="14" fill="#4B2A85" font-weight="700">Horizon 3 - visionaries</text><text x="658" y="410" font-size="14" fill="#4B2A85" font-weight="700">create viable options</text><text x="658" y="448" font-size="12.5" font-weight="700" fill="#B8952E">Long term</text><text x="658" y="470" font-size="12.5" fill="#1F1A26">Succession; partner health and</text><text x="658" y="486" font-size="12.5" fill="#1F1A26">capacity; what the business</text><text x="658" y="502" font-size="12.5" fill="#1F1A26">becomes when you stop</text><text x="30" y="538" font-size="13.5" fill="#1F1A26" font-weight="600">Run three parallel time frames, with only one or two initiatives in each.</text></svg>