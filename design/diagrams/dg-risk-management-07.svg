<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 546" role="img" style="display:block;width:100%;height:auto;font-family:'Source Sans 3',system-ui,sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#4B2A85"></path></marker></defs>
<text x="30" y="26" font-size="12.5" letter-spacing="1.6" fill="#6B6478">RISK MANAGEMENT · SECTION 6 · THE RISK, AND THE HANDLING</text><line x1="30" y1="40" x2="930" y2="40" stroke="#B8952E" stroke-width="1"></line>
<rect x="30" y="66" width="216" height="212" rx="4" fill="#FFFFFF" stroke="#E3DEEA"></rect><rect x="30" y="66" width="216" height="4" fill="#4B2A85"></rect><text x="46" y="98" font-size="14.5" fill="#4B2A85" font-weight="700">The disappearing client</text><text x="46" y="125" font-size="13" fill="#1F1A26">Fails to respond</text><line x1="46" y1="148" x2="230" y2="148" stroke="#B8952E"></line><text x="46" y="168" font-size="12" fill="#6B6478">Ask yourself: how would our</text><text x="46" y="183" font-size="12" fill="#6B6478">attempts to reach this</text><text x="46" y="198" font-size="12" fill="#6B6478">client present under</text><text x="46" y="213" font-size="12" fill="#6B6478">cross-examination? Document</text><text x="46" y="228" font-size="12" fill="#6B6478">each attempt: call, no</text><text x="46" y="243" font-size="12" fill="#6B6478">answer, voicemail left,</text><text x="46" y="258" font-size="12" fill="#6B6478">support staff attended,</text><text x="46" y="273" font-size="12" fill="#6B6478">follow-up letter.</text><rect x="258" y="66" width="216" height="212" rx="4" fill="#FFFFFF" stroke="#E3DEEA"></rect><rect x="258" y="66" width="216" height="4" fill="#4B2A85"></rect><text x="274" y="98" font-size="14.5" fill="#4B2A85" font-weight="700">The &#34;don’t involve me&#34;</text><text x="274" y="117" font-size="14.5" fill="#4B2A85" font-weight="700">client</text><text x="274" y="144" font-size="13" fill="#1F1A26">Wants the solicitor to</text><text x="274" y="161" font-size="13" fill="#1F1A26">make the decisions</text><line x1="274" y1="184" x2="458" y2="184" stroke="#B8952E"></line><text x="274" y="204" font-size="12" fill="#6B6478">Keep them engaged so they</text><text x="274" y="219" font-size="12" fill="#6B6478">truly understand, and</text><text x="274" y="234" font-size="12" fill="#6B6478">document it.</text><rect x="486" y="66" width="216" height="212" rx="4" fill="#FFFFFF" stroke="#E3DEEA"></rect><rect x="486" y="66" width="216" height="4" fill="#4B2A85"></rect><text x="502" y="98" font-size="14.5" fill="#4B2A85" font-weight="700">The transferred client</text><text x="502" y="125" font-size="13" fill="#1F1A26">Won’t pay the former</text><text x="502" y="142" font-size="13" fill="#1F1A26">solicitor’s fees; the file</text><text x="502" y="159" font-size="13" fill="#1F1A26">is usually poor</text><line x1="502" y1="182" x2="686" y2="182" stroke="#B8952E"></line><text x="502" y="202" font-size="12" fill="#6B6478">Do not refuse transferred</text><text x="502" y="217" font-size="12" fill="#6B6478">matters. Do run due</text><text x="502" y="232" font-size="12" fill="#6B6478">diligence, and tell the</text><text x="502" y="247" font-size="12" fill="#6B6478">client what you are doing.</text><rect x="714" y="66" width="216" height="212" rx="4" fill="#FFFFFF" stroke="#E3DEEA"></rect><rect x="714" y="66" width="216" height="4" fill="#4B2A85"></rect><text x="730" y="98" font-size="14.5" fill="#4B2A85" font-weight="700">The extended family</text><text x="730" y="117" font-size="14.5" fill="#4B2A85" font-weight="700">client</text><text x="730" y="144" font-size="13" fill="#1F1A26">Who is actually the</text><text x="730" y="161" font-size="13" fill="#1F1A26">client?</text><line x1="730" y1="184" x2="914" y2="184" stroke="#B8952E"></line><text x="730" y="204" font-size="12" fill="#6B6478">Clear out the non-clients.</text><text x="730" y="219" font-size="12" fill="#6B6478">Have the confidential</text><text x="730" y="234" font-size="12" fill="#6B6478">conversation with them</text><text x="730" y="249" font-size="12" fill="#6B6478">alone.</text><rect x="30" y="296" width="216" height="212" rx="4" fill="#FFFFFF" stroke="#E3DEEA"></rect><rect x="30" y="296" width="216" height="4" fill="#4B2A85"></rect><text x="46" y="328" font-size="14.5" fill="#4B2A85" font-weight="700">The experienced claimant</text><text x="46" y="347" font-size="14.5" fill="#4B2A85" font-weight="700">client</text><text x="46" y="374" font-size="13" fill="#1F1A26">Notorious fee dodger</text><rect x="258" y="296" width="216" height="212" rx="4" fill="#FFFFFF" stroke="#E3DEEA"></rect><rect x="258" y="296" width="216" height="4" fill="#4B2A85"></rect><text x="274" y="328" font-size="14.5" fill="#4B2A85" font-weight="700">The non-English speaking</text><text x="274" y="347" font-size="14.5" fill="#4B2A85" font-weight="700">client</text><text x="274" y="374" font-size="13" fill="#1F1A26">Who is interpreting?</text><line x1="274" y1="397" x2="458" y2="397" stroke="#B8952E"></line><text x="274" y="417" font-size="12" fill="#6B6478">Use an independent</text><text x="274" y="432" font-size="12" fill="#6B6478">interpreter, even if you or</text><text x="274" y="447" font-size="12" fill="#6B6478">a staff member speaks the</text><text x="274" y="462" font-size="12" fill="#6B6478">language.</text><rect x="486" y="296" width="216" height="212" rx="4" fill="#FFFFFF" stroke="#E3DEEA"></rect><rect x="486" y="296" width="216" height="4" fill="#4B2A85"></rect><text x="502" y="328" font-size="14.5" fill="#4B2A85" font-weight="700">The family and friend</text><text x="502" y="347" font-size="14.5" fill="#4B2A85" font-weight="700">client</text><text x="502" y="374" font-size="13" fill="#1F1A26">Potential for conflict and</text><text x="502" y="391" font-size="13" fill="#1F1A26">lack of detailed file</text><text x="502" y="408" font-size="13" fill="#1F1A26">notes</text></svg>