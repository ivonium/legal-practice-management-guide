<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 516" role="img" style="display:block;width:100%;height:auto;font-family:'Source Sans 3',system-ui,sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#4B2A85"></path></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#B8952E"></path></marker></defs>
<text x="30" y="26" font-size="12.5" letter-spacing="1.6" fill="#6B6478">PRACTICE MANAGEMENT · SECTION 1.3 · COMPANION TO THE CALCULATOR</text><line x1="30" y1="40" x2="930" y2="40" stroke="#B8952E" stroke-width="1"></line>
<rect x="30" y="60" width="900" height="78" rx="4" fill="#EAE3F4" stroke="#4B2A85"></rect><text x="480" y="110" text-anchor="middle" font-size="28" font-weight="700" fill="#4B2A85">Net profit per principal = (1 + L) x BR x CH x R x M</text><rect x="30" y="162" width="170.4" height="230" rx="4" fill="#FFFFFF" stroke="#E3DEEA"></rect><text x="46" y="204" font-size="26" font-weight="700" fill="#B8952E">L</text><text x="46" y="230" font-size="15" fill="#4B2A85" font-weight="700">Leverage</text><text x="46" y="262" font-size="10.5" letter-spacing="1.1" fill="#6B6478">WHAT IT IS</text><text x="46" y="280" font-size="12.5" fill="#1F1A26">Employed fee earners</text><text x="46" y="296" font-size="12.5" fill="#1F1A26">per equity principal</text><text x="46" y="336" font-size="10.5" letter-spacing="1.1" fill="#6B6478">NOTES</text><text x="46" y="354" font-size="12.5" fill="#1F1A26">The &#34;1 +&#34; captures the</text><text x="46" y="370" font-size="12.5" fill="#1F1A26">principal’s own</text><text x="46" y="386" font-size="12.5" fill="#1F1A26">fee-earning capacity</text><rect x="212.4" y="162" width="170.4" height="230" rx="4" fill="#FFFFFF" stroke="#E3DEEA"></rect><text x="228.4" y="204" font-size="26" font-weight="700" fill="#B8952E">BR</text><text x="228.4" y="230" font-size="15" fill="#4B2A85" font-weight="700">Billing rate</text><text x="228.4" y="262" font-size="10.5" letter-spacing="1.1" fill="#6B6478">WHAT IT IS</text><text x="228.4" y="280" font-size="12.5" fill="#1F1A26">Weighted average</text><text x="228.4" y="296" font-size="12.5" fill="#1F1A26">charge rate across all</text><text x="228.4" y="312" font-size="12.5" fill="#1F1A26">fee earners</text><text x="228.4" y="336" font-size="10.5" letter-spacing="1.1" fill="#6B6478">NOTES</text><text x="228.4" y="354" font-size="12.5" fill="#1F1A26">Not the partner rate.</text><text x="228.4" y="370" font-size="12.5" fill="#1F1A26">The weighted average</text><rect x="394.8" y="162" width="170.4" height="230" rx="4" fill="#FFFFFF" stroke="#E3DEEA"></rect><text x="410.8" y="204" font-size="26" font-weight="700" fill="#B8952E">CH</text><text x="410.8" y="230" font-size="15" fill="#4B2A85" font-weight="700">Chargeable hours</text><text x="410.8" y="262" font-size="10.5" letter-spacing="1.1" fill="#6B6478">WHAT IT IS</text><text x="410.8" y="280" font-size="12.5" fill="#1F1A26">Weighted average</text><text x="410.8" y="296" font-size="12.5" fill="#1F1A26">annual chargeable</text><text x="410.8" y="312" font-size="12.5" fill="#1F1A26">hours per fee earner</text><text x="410.8" y="336" font-size="10.5" letter-spacing="1.1" fill="#6B6478">NOTES</text><text x="410.8" y="354" font-size="12.5" fill="#1F1A26">1,100 hours is roughly</text><text x="410.8" y="370" font-size="12.5" fill="#1F1A26">5 per day</text><rect x="577.2" y="162" width="170.4" height="230" rx="4" fill="#FFFFFF" stroke="#E3DEEA"></rect><text x="593.2" y="204" font-size="26" font-weight="700" fill="#B8952E">R</text><text x="593.2" y="230" font-size="15" fill="#4B2A85" font-weight="700">Realisation</text><text x="593.2" y="262" font-size="10.5" letter-spacing="1.1" fill="#6B6478">WHAT IT IS</text><text x="593.2" y="280" font-size="12.5" fill="#1F1A26">Conversion of WIP into</text><text x="593.2" y="296" font-size="12.5" fill="#1F1A26">billings</text><text x="593.2" y="336" font-size="10.5" letter-spacing="1.1" fill="#6B6478">NOTES</text><text x="593.2" y="354" font-size="12.5" fill="#1F1A26">Most firms write off</text><text x="593.2" y="370" font-size="12.5" fill="#1F1A26">about 15%, so R = 85%</text><rect x="759.6" y="162" width="170.4" height="230" rx="4" fill="#FFFFFF" stroke="#E3DEEA"></rect><text x="775.6" y="204" font-size="26" font-weight="700" fill="#B8952E">M</text><text x="775.6" y="230" font-size="15" fill="#4B2A85" font-weight="700">Profit margin</text><text x="775.6" y="262" font-size="10.5" letter-spacing="1.1" fill="#6B6478">WHAT IT IS</text><text x="775.6" y="280" font-size="12.5" fill="#1F1A26">What is left after</text><text x="775.6" y="296" font-size="12.5" fill="#1F1A26">salaries and overheads</text><text x="775.6" y="336" font-size="10.5" letter-spacing="1.1" fill="#6B6478">NOTES</text><text x="775.6" y="354" font-size="12.5" fill="#1F1A26">Around 30% before</text><text x="775.6" y="370" font-size="12.5" fill="#1F1A26">principal salaries,</text><text x="775.6" y="386" font-size="12.5" fill="#1F1A26">give or take 10%</text><rect x="30" y="408" width="440" height="86" rx="4" fill="#F5EFDD" stroke="#B8952E"></rect><text x="46" y="436" font-size="13" fill="#1F1A26">Worked example - an established firm. Leverage 2.5 (so</text><text x="46" y="453" font-size="13" fill="#1F1A26">3.5), weighted average rate $350, 1,100 hours, 85%</text><text x="46" y="470" font-size="13" fill="#1F1A26">realisation, 35% margin. Result: roughly $401,000 net</text><text x="46" y="487" font-size="13" fill="#1F1A26">profit per principal.</text><rect x="490" y="408" width="440" height="86" rx="4" fill="#F5EFDD" stroke="#B8952E"></rect><text x="506" y="436" font-size="13" fill="#1F1A26">Worked example - a part-time sole practice. No</text><text x="506" y="453" font-size="13" fill="#1F1A26">employees (so 1.0), $500 per hour, 5.5 hours a day, 3</text><text x="506" y="470" font-size="13" fill="#1F1A26">days a week, 44 working weeks (726 hours), 90%</text><text x="506" y="487" font-size="13" fill="#1F1A26">realisation, 70% margin. Result: roughly $229,000.</text></svg>