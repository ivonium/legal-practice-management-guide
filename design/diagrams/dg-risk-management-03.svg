<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 616" role="img" style="display:block;width:100%;height:auto;font-family:'Source Sans 3',system-ui,sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#4B2A85"></path></marker></defs>
<text x="30" y="26" font-size="12.5" letter-spacing="1.6" fill="#6B6478">RISK MANAGEMENT · SECTION 2.6 · ZAKKA v ELIAS [2013] NSWCA 119</text><line x1="30" y1="40" x2="930" y2="40" stroke="#B8952E" stroke-width="1"></line>
<rect x="30" y="70" width="410" height="120" rx="4" fill="#FFFFFF" stroke="#4B2A85" stroke-width="1.4"></rect><text x="48" y="102" font-size="16" fill="#4B2A85" font-weight="700">Work done in the course of the</text><text x="48" y="123" font-size="16" fill="#4B2A85" font-weight="700">practice</text><line x1="440" y1="130" x2="496" y2="130" stroke="#4B2A85" marker-end="url(#a)"></line><rect x="504" y="70" width="426" height="120" rx="4" fill="#EAE3F4" stroke="#4B2A85"></rect><text x="522" y="110" font-size="20" fill="#4B2A85" font-weight="700">covered</text><rect x="30" y="214" width="410" height="168" rx="4" fill="#FCEBEB" stroke="#D98C8C" stroke-width="1.4"></rect><text x="48" y="246" font-size="16" fill="#1F1A26" font-weight="700">Work done unsupervised, outside the</text><text x="48" y="267" font-size="16" fill="#1F1A26" font-weight="700">practice, for a non-client, free of</text><text x="48" y="288" font-size="16" fill="#1F1A26" font-weight="700">charge</text><text x="48" y="330" font-size="13.5" fill="#1F1A26">&#34;a clear case of a solicitor engaging in a</text><text x="48" y="347" font-size="13.5" fill="#1F1A26">frolic of her own or at her own whim&#34;</text><line x1="440" y1="298" x2="496" y2="298" stroke="#D98C8C" marker-end="url(#a)"></line><rect x="504" y="214" width="426" height="168" rx="4" fill="#FFFFFF" stroke="#D98C8C" stroke-width="1.6"></rect><text x="522" y="254" font-size="20" fill="#1F1A26" font-weight="700">not covered; personal exposure</text><text x="522" y="314" font-size="13.5" fill="#1F1A26">Lawcover’s policy could respond for the</text><text x="522" y="331" font-size="13.5" fill="#1F1A26">principal, but not for the employee.</text><text x="522" y="348" font-size="13.5" fill="#1F1A26">Potential personal liability of $700,000.</text><text x="30" y="424" font-size="12.5" letter-spacing="1.3" fill="#6B6478">THE PRACTICAL FIX</text><rect x="30" y="440" width="900" height="40" rx="3" fill="#FFFFFF" stroke="#E3DEEA"></rect><text x="48" y="462" font-size="13" font-weight="700" fill="#B8952E">1</text><text x="66" y="462" font-size="13.5" fill="#1F1A26">Whether the firm takes on that client is at the principal’s discretion.</text><rect x="30" y="488" width="900" height="58" rx="3" fill="#F4F1F8" stroke="#E3DEEA"></rect><text x="48" y="510" font-size="13" font-weight="700" fill="#B8952E">2</text><text x="66" y="510" font-size="13.5" fill="#1F1A26">What fees are charged is at the principal’s discretion - normal rates, an increased rate if the</text><text x="66" y="528" font-size="13.5" fill="#1F1A26">client is high risk, or a discount.</text><rect x="30" y="554" width="900" height="40" rx="3" fill="#FFFFFF" stroke="#E3DEEA"></rect><text x="48" y="576" font-size="13" font-weight="700" fill="#B8952E">3</text><text x="66" y="576" font-size="13.5" fill="#1F1A26">Nothing is done outside the firm’s file and system.</text></svg>