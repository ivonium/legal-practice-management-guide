<text x="30" y="26" font-size="12.5" letter-spacing="1.6" fill="#6B6478">RISK MANAGEMENT · SECTION 2.2</text><line x1="30" y1="40" x2="930" y2="40" stroke="#B8952E" stroke-width="1"></line>
<text x="30" y="92" font-size="15" fill="#4B2A85" font-weight="700">Primary policy</text><rect x="250" y="76" width="560" height="26" fill="#F4F1F8"></rect><rect x="250" y="76" width="56" height="26" fill="#4B2A85"></rect><text x="250" y="122" font-size="13.5" fill="#1F1A26">$2 million</text><text x="30" y="172" font-size="15" fill="#4B2A85" font-weight="700">Optional top up</text><rect x="250" y="156" width="560" height="26" fill="#F4F1F8"></rect><rect x="250" y="156" width="560" height="26" fill="#4B2A85"></rect><text x="250" y="202" font-size="13.5" fill="#1F1A26">Up to $20 million total (a further $18 million)</text><text x="30" y="252" font-size="15" fill="#4B2A85" font-weight="700">Run-off cover</text><rect x="250" y="236" width="560" height="26" fill="#F4F1F8"></rect><rect x="250" y="236" width="560" height="26" fill="none" stroke="#B8952E" stroke-dasharray="4 4"></rect><text x="250" y="282" font-size="13.5" fill="#1F1A26">Free and unlimited on the primary policy</text><text x="30" y="332" font-size="15" fill="#4B2A85" font-weight="700">Group cyber risk policy</text><rect x="250" y="316" width="560" height="26" fill="#F4F1F8"></rect><rect x="250" y="316" width="10" height="26" fill="#4B2A85"></rect><text x="250" y="362" font-size="13.5" fill="#1F1A26">Free, up to $50,000 limit, no premium payable</text><rect x="30" y="390" width="900" height="56" rx="4" fill="#F5EFDD" stroke="#B8952E"></rect><text x="48" y="424" font-size="14" fill="#1F1A26" font-weight="700">If you hold top-up insurance, you need to arrange separate run-off for it when you come off risk.</text></svg>