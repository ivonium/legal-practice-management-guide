<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 612" role="img" style="display:block;width:100%;height:auto;font-family:'Source Sans 3',system-ui,sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#4B2A85"></path></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#B8952E"></path></marker></defs>
<text x="30" y="26" font-size="12.5" letter-spacing="1.6" fill="#6B6478">TRUST ACCOUNTING · SECTIONS 15.1 AND 21</text><line x1="30" y1="40" x2="930" y2="40" stroke="#B8952E" stroke-width="1"></line>
<circle cx="480" cy="300" r="180" fill="none" stroke="#E3DEEA" stroke-width="1.5"></circle><circle cx="480" cy="300" r="124" fill="none" stroke="#B8952E" stroke-width="1" stroke-dasharray="3 6"></circle><text x="480" y="294" text-anchor="middle" font-size="15" font-weight="700" fill="#4B2A85">The trust year</text><text x="480" y="316" text-anchor="middle" font-size="14" fill="#1F1A26">1 April to 31 March (s 155(1))</text><circle cx="480.0" cy="120.0" r="7" fill="#4B2A85"></circle><text x="480.0" y="94.0" text-anchor="start" font-size="14" font-weight="700" fill="#4B2A85">1 April</text><text x="480.0" y="112.0" text-anchor="start" font-size="12.5" fill="#1F1A26">Trust year begins</text><circle cx="635.9" cy="210.0" r="7" fill="#4B2A85"></circle><text x="658.4" y="197.0" text-anchor="start" font-size="14" font-weight="700" fill="#4B2A85">30 April</text><text x="658.4" y="215.0" text-anchor="start" font-size="12.5" fill="#1F1A26">Part A — Confirmation of Trust</text><text x="658.4" y="231.0" text-anchor="start" font-size="12.5" fill="#1F1A26">Money, every practice (r 54)</text><circle cx="653.9" cy="346.6" r="7" fill="#4B2A85"></circle><text x="679.0" y="353.3" text-anchor="start" font-size="14" font-weight="700" fill="#4B2A85">31 May</text><text x="679.0" y="371.3" text-anchor="start" font-size="12.5" fill="#1F1A26">Part B — Statement of Trust Money;</text><text x="679.0" y="387.3" text-anchor="start" font-size="12.5" fill="#1F1A26">External Examiner’s Report (s 155;</text><text x="679.0" y="403.3" text-anchor="start" font-size="12.5" fill="#1F1A26">r 67)</text><circle cx="541.6" cy="469.1" r="7" fill="#4B2A85"></circle><text x="550.5" y="493.6" text-anchor="start" font-size="14" font-weight="700" fill="#4B2A85">30 June</text><text x="550.5" y="511.6" text-anchor="start" font-size="12.5" fill="#1F1A26">Annual trust account statements</text><text x="550.5" y="527.6" text-anchor="start" font-size="12.5" fill="#1F1A26">(given in practice by mid to late</text><text x="550.5" y="543.6" text-anchor="start" font-size="12.5" fill="#1F1A26">July) (r 52(4)(c))</text><circle cx="376.8" cy="447.4" r="7" fill="#4B2A85"></circle><text x="361.8" y="468.7" text-anchor="end" font-size="14" font-weight="700" fill="#4B2A85">During July</text><text x="361.8" y="486.7" text-anchor="end" font-size="12.5" fill="#1F1A26">Notify authorised signatories as</text><text x="361.8" y="502.7" text-anchor="end" font-size="12.5" fill="#1F1A26">at 1 July (r 50(2))</text><circle cx="306.1" cy="253.4" r="7" fill="#4B2A85"></circle><text x="281.0" y="246.7" text-anchor="end" font-size="14" font-weight="700" fill="#4B2A85">31 March</text><text x="281.0" y="264.7" text-anchor="end" font-size="12.5" fill="#1F1A26">Trust year ends</text><rect x="30" y="520" width="430" height="76" rx="4" fill="#F5EFDD" stroke="#B8952E"></rect><text x="44" y="548" font-size="13.5" fill="#1F1A26" font-weight="600">Within 20 banking days of 31 Mar / 30 Jun / 30 Sep /</text><text x="44" y="566" font-size="13.5" fill="#1F1A26" font-weight="600">31 Dec: calculate and adjust the statutory deposit</text><text x="44" y="584" font-size="13.5" fill="#1F1A26" font-weight="600">(Application Reg ss 12-13).</text></svg>