<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 340" role="img" style="display:block;width:100%;height:auto;font-family:'Source Sans 3',system-ui,sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#4B2A85"></path></marker></defs>
<text x="30" y="26" font-size="12.5" letter-spacing="1.6" fill="#6B6478">RISK MANAGEMENT · SECTION 1</text><line x1="30" y1="40" x2="930" y2="40" stroke="#B8952E" stroke-width="1"></line>
<rect x="30" y="66" width="216" height="200" rx="4" fill="#FFFFFF" stroke="#E3DEEA"></rect><rect x="30" y="66" width="216" height="4" fill="#B8952E"></rect><text x="46" y="150" font-size="54" font-weight="700" fill="#4B2A85">37%</text><text x="46" y="182" font-size="14" fill="#1F1A26">of all claims arise from</text><text x="46" y="201" font-size="14" fill="#1F1A26">property and conveyancing</text><rect x="258" y="66" width="216" height="200" rx="4" fill="#FFFFFF" stroke="#E3DEEA"></rect><rect x="258" y="66" width="216" height="4" fill="#B8952E"></rect><text x="274" y="150" font-size="54" font-weight="700" fill="#4B2A85">42%</text><text x="274" y="182" font-size="14" fill="#1F1A26">of all claims are caused</text><text x="274" y="201" font-size="14" fill="#1F1A26">by poor communication with</text><text x="274" y="220" font-size="14" fill="#1F1A26">clients</text><rect x="486" y="66" width="216" height="200" rx="4" fill="#FFFFFF" stroke="#E3DEEA"></rect><rect x="486" y="66" width="216" height="4" fill="#B8952E"></rect><text x="502" y="150" font-size="54" font-weight="700" fill="#4B2A85">23%</text><text x="502" y="182" font-size="14" fill="#1F1A26">are caused by not knowing</text><text x="502" y="201" font-size="14" fill="#1F1A26">the law adequately</text><rect x="714" y="66" width="216" height="200" rx="4" fill="#FFFFFF" stroke="#E3DEEA"></rect><rect x="714" y="66" width="216" height="4" fill="#B8952E"></rect><text x="730" y="150" font-size="54" font-weight="700" fill="#4B2A85">&gt;90%</text><text x="730" y="182" font-size="14" fill="#1F1A26">of cyber claims are caused</text><text x="730" y="201" font-size="14" fill="#1F1A26">by business email</text><text x="730" y="220" font-size="14" fill="#1F1A26">compromise</text><text x="30" y="300" font-size="13.5" fill="#1F1A26">Claims are overwhelmingly not about black letter law. They are about the contributing factors: time pressure, underpricing,</text><text x="30" y="318" font-size="13.5" fill="#1F1A26">poor file notes, undefined retainers, weak supervision, and failures of basic interpersonal skill.</text></svg>