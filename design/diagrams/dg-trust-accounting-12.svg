<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 673" role="img" style="display:block;width:100%;height:auto;font-family:'Source Sans 3',system-ui,sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#4B2A85"></path></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#B8952E"></path></marker></defs>
<text x="30" y="26" font-size="12.5" letter-spacing="1.6" fill="#6B6478">TRUST ACCOUNTING · SECTION 10.1</text><line x1="30" y1="40" x2="930" y2="40" stroke="#B8952E" stroke-width="1"></line>
<rect x="60" y="70" width="560" height="61" rx="4" fill="#FFFFFF" stroke="#4B2A85" stroke-width="1.3"></rect><circle cx="60" cy="96" r="12" fill="#4B2A85"></circle><text x="60" y="101" text-anchor="middle" font-size="12" font-weight="700" fill="#FFFFFF">1</text><text x="80" y="96" font-size="14.5" fill="#4B2A85" font-weight="700">Written direction</text><text x="80" y="119" font-size="12.5" fill="#6B6478" font-weight="600">s 139(1) · retain 7 years (s 139(5))</text><line x1="60" y1="131" x2="60" y2="147" stroke="#4B2A85" marker-end="url(#a)"></line><rect x="60" y="147" width="560" height="77" rx="4" fill="#FFFFFF" stroke="#4B2A85" stroke-width="1.3"></rect><circle cx="60" cy="173" r="12" fill="#4B2A85"></circle><text x="60" y="178" text-anchor="middle" font-size="12" font-weight="700" fill="#FFFFFF">2</text><text x="80" y="173" font-size="14.5" fill="#4B2A85" font-weight="700">Establish the CMA with an ADI; account name per r 61</text><text x="80" y="196" font-size="12.5" fill="#6B6478" font-weight="600">practice name; &#34;controlled money account&#34;, &#34;CMA&#34; or &#34;CMA/c&#34;;</text><text x="80" y="212" font-size="12.5" fill="#6B6478" font-weight="600">particulars sufficient to identify the purpose</text><line x1="60" y1="224" x2="60" y2="240" stroke="#4B2A85" marker-end="url(#a)"></line><rect x="60" y="240" width="560" height="61" rx="4" fill="#FFFFFF" stroke="#4B2A85" stroke-width="1.3"></rect><circle cx="60" cy="266" r="12" fill="#4B2A85"></circle><text x="60" y="271" text-anchor="middle" font-size="12" font-weight="700" fill="#FFFFFF">3</text><text x="80" y="266" font-size="14.5" fill="#4B2A85" font-weight="700">Controlled money receipt</text><text x="80" y="289" font-size="12.5" fill="#6B6478" font-weight="600">r 62 · as soon as practicable</text><line x1="60" y1="301" x2="60" y2="317" stroke="#4B2A85" marker-end="url(#a)"></line><rect x="60" y="317" width="560" height="61" rx="4" fill="#FFFFFF" stroke="#4B2A85" stroke-width="1.3"></rect><circle cx="60" cy="343" r="12" fill="#4B2A85"></circle><text x="60" y="348" text-anchor="middle" font-size="12" font-weight="700" fill="#FFFFFF">4</text><text x="80" y="343" font-size="14.5" fill="#4B2A85" font-weight="700">Movement record and register</text><text x="80" y="366" font-size="12.5" fill="#6B6478" font-weight="600">r 64</text><line x1="60" y1="378" x2="60" y2="394" stroke="#4B2A85" marker-end="url(#a)"></line><rect x="60" y="394" width="560" height="80" rx="4" fill="#FFFFFF" stroke="#4B2A85" stroke-width="1.3"></rect><circle cx="60" cy="420" r="12" fill="#4B2A85"></circle><text x="60" y="425" text-anchor="middle" font-size="12" font-weight="700" fill="#FFFFFF">5</text><text x="80" y="420" font-size="14.5" fill="#4B2A85" font-weight="700">Monthly listing within 15 working days,</text><text x="80" y="439" font-size="14.5" fill="#4B2A85" font-weight="700">principal-reviewed</text><text x="80" y="462" font-size="12.5" fill="#6B6478" font-weight="600">r 64(9)</text><line x1="60" y1="474" x2="60" y2="490" stroke="#4B2A85" marker-end="url(#a)"></line><rect x="60" y="490" width="560" height="80" rx="4" fill="#FFFFFF" stroke="#4B2A85" stroke-width="1.3"></rect><circle cx="60" cy="516" r="12" fill="#4B2A85"></circle><text x="60" y="521" text-anchor="middle" font-size="12" font-weight="700" fill="#FFFFFF">6</text><text x="80" y="516" font-size="14.5" fill="#4B2A85" font-weight="700">Withdrawals only per direction / r 42 / court order.</text><text x="80" y="535" font-size="14.5" fill="#4B2A85" font-weight="700">Cheque or EFT only, no BPAY</text><text x="80" y="558" font-size="12.5" fill="#6B6478" font-weight="600">r 63</text><line x1="60" y1="570" x2="60" y2="586" stroke="#4B2A85" marker-end="url(#a)"></line><rect x="60" y="586" width="560" height="61" rx="4" fill="#FFFFFF" stroke="#4B2A85" stroke-width="1.3"></rect><circle cx="60" cy="612" r="12" fill="#4B2A85"></circle><text x="60" y="617" text-anchor="middle" font-size="12" font-weight="700" fill="#FFFFFF">7</text><text x="80" y="612" font-size="14.5" fill="#4B2A85" font-weight="700">Statement</text><text x="80" y="635" font-size="12.5" fill="#6B6478" font-weight="600">r 52</text><rect x="660" y="70" width="270" height="120" rx="4" fill="#F5EFDD" stroke="#B8952E" stroke-width="1.6"></rect><text x="676" y="102" font-size="15.5" fill="#1F1A26" font-weight="700">Controlled money exists so</text><text x="676" y="122" font-size="15.5" fill="#1F1A26" font-weight="700">the client earns the</text><text x="676" y="142" font-size="15.5" fill="#1F1A26" font-weight="700">interest.</text><text x="676" y="160" font-size="13" fill="#1F1A26">Interest on the GTA goes to</text><text x="676" y="177" font-size="13" fill="#1F1A26">the Public Purpose Fund.</text><rect x="660" y="206" width="270" height="104" rx="4" fill="#FFFFFF" stroke="#E3DEEA"></rect><text x="676" y="236" font-size="13.5" fill="#1F1A26">No pooling (s 139(6)). Held</text><text x="676" y="254" font-size="13.5" fill="#1F1A26">exclusively for the person</text><text x="676" y="272" font-size="13.5" fill="#1F1A26">directing.</text></svg>