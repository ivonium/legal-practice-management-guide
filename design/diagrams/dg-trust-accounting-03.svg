<text x="76" y="379" font-size="14.5" fill="#1F1A26">It must go to the GTA (or CMA for controlled money) before anything else, whatever the</text>
<text x="76" y="398" font-size="14.5" fill="#1F1A26">direction says (s 143). <tspan font-weight="600">Then continue.</tspan></text>
<line x1="700" y1="358" x2="700" y2="358" stroke="#B8952E"></line>
</g>

