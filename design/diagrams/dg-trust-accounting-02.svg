<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" role="img" style="display:block;width:100%;height:auto;font-family:'Source Sans 3',system-ui,sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#4B2A85"></path></marker>
<marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#B8952E"></path></marker></defs>
<text x="30" y="26" font-size="12.5" letter-spacing="1.6" fill="#6B6478">TRUST ACCOUNTING · SECTIONS 3.1 AND 3.2</text><line x1="30" y1="40" x2="930" y2="40" stroke="#B8952E" stroke-width="1"></line>
<rect x="30" y="70" width="440" height="330" rx="4" fill="#FFFFFF" stroke="#E3DEEA"></rect><text x="50" y="100" font-size="13" letter-spacing="1.2" fill="#6B6478">s 34</text><text x="50" y="126" font-size="17" fill="#4B2A85" font-weight="700">Responsibilities of principals</text><rect x="50" y="165" width="400" height="102" rx="3" fill="#EAE3F4" stroke="#E3DEEA" stroke-width="1"></rect><text x="64" y="185" font-size="13" font-weight="700" fill="#4B2A85">(a)</text><text x="90" y="185" font-size="13.5" fill="#1F1A26">all legal practitioner associates comply with</text><text x="90" y="203" font-size="13.5" fill="#1F1A26">their obligations under the Uniform Law, the</text><text x="90" y="221" font-size="13.5" fill="#1F1A26">Uniform Rules and their other professional</text><text x="90" y="239" font-size="13.5" fill="#1F1A26">obligations</text><rect x="50" y="279" width="400" height="64" rx="3" fill="#EAE3F4" stroke="#E3DEEA" stroke-width="1"></rect><text x="64" y="299" font-size="13" font-weight="700" fill="#4B2A85">(b)</text><text x="90" y="299" font-size="13.5" fill="#1F1A26">legal services provided by the practice are</text><text x="90" y="317" font-size="13.5" fill="#1F1A26">provided in accordance with those obligations</text><text x="50" y="371" font-size="13.5" fill="#1F1A26" font-weight="600">Failure may amount to unsatisfactory professional conduct</text><text x="50" y="389" font-size="13.5" fill="#1F1A26" font-weight="600">or professional misconduct (ss 296, 297, 298).</text><rect x="490" y="70" width="440" height="330" rx="4" fill="#FFFFFF" stroke="#E3DEEA"></rect><text x="510" y="100" font-size="13" letter-spacing="1.2" fill="#6B6478">s 35</text><text x="510" y="126" font-size="17" fill="#4B2A85" font-weight="700">Liability of principals</text><rect x="510" y="165" width="400" height="45" rx="3" fill="#EAE3F4" stroke="#E3DEEA" stroke-width="1"></rect><text x="524" y="185" font-size="13" font-weight="700" fill="#4B2A85">(a)</text><text x="550" y="185" font-size="13.5" fill="#1F1A26">the principal knowingly authorised or permitted</text><text x="550" y="203" font-size="13.5" fill="#1F1A26">it</text><rect x="510" y="222" width="400" height="102" rx="3" fill="#F5EFDD" stroke="#B8952E" stroke-width="1.6"></rect><text x="524" y="242" font-size="13" font-weight="700" fill="#1F1A26">(b)</text><text x="550" y="242" font-size="13.5" fill="#1F1A26">the principal was in (or ought reasonably to</text><text x="550" y="260" font-size="13.5" fill="#1F1A26">have been in) a position to influence the</text><text x="550" y="278" font-size="13.5" fill="#1F1A26">practice’s conduct and failed to take</text><text x="550" y="296" font-size="13.5" fill="#1F1A26">reasonable steps to prevent it</text><text x="510" y="352" font-size="13.5" fill="#1F1A26" font-weight="600">The second limb is the operative one. You do not need to</text><text x="510" y="370" font-size="13.5" fill="#1F1A26" font-weight="600">have known.</text><rect x="30" y="424" width="900" height="56" rx="4" fill="#EAE3F4" stroke="#4B2A85"></rect><text x="50" y="458" font-size="15" font-weight="700" fill="#4B2A85">Any contravention by the practice</text><line x1="330" y1="452" x2="470" y2="452" stroke="#4B2A85" marker-end="url(#a)"></line><text x="360" y="444" font-size="11.5" fill="#4B2A85" font-weight="600">s 34</text><line x1="560" y1="452" x2="700" y2="452" stroke="#4B2A85" marker-end="url(#a)"></line><text x="590" y="444" font-size="11.5" fill="#4B2A85" font-weight="600">s 35</text><text x="730" y="458" font-size="15" font-weight="700" fill="#4B2A85">Each principal</text></svg>