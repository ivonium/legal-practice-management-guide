<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 572" role="img" style="display:block;width:100%;height:auto;font-family:'Source Sans 3',system-ui,sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#4B2A85"></path></marker></defs>
<text x="30" y="26" font-size="12.5" letter-spacing="1.6" fill="#6B6478">RISK MANAGEMENT · SECTION 10.3</text><line x1="30" y1="40" x2="930" y2="40" stroke="#B8952E" stroke-width="1"></line>
<rect x="30" y="62" width="900" height="150" rx="4" fill="#FCEBEB" stroke="#D98C8C" stroke-width="2"></rect><text x="52" y="92" font-size="11.5" letter-spacing="1.3" fill="#6B6478">THE PII SCHEDULE PROVIDES</text><text x="52" y="124" font-size="16" fill="#1F1A26" font-weight="600">Excess: EXCEPT THAT excess means twice that amount for claims arising from any</text><text x="52" y="146" font-size="16" fill="#1F1A26" font-weight="600">payment or electronic funds transfer made on an instruction or authorisation that</text><text x="52" y="168" font-size="16" fill="#1F1A26" font-weight="600">the law practice did not take reasonable steps to verify.</text><rect x="30" y="228" width="900" height="52" rx="4" fill="#4B2A85"></rect><text x="52" y="260" font-size="17" font-weight="700" fill="#FFFFFF">If you pay out on an unverified instruction, your excess doubles.</text><text x="30" y="316" font-size="12.5" letter-spacing="1.3" fill="#6B6478">THE VERIFICATION CONTROLS</text><rect x="30" y="330" width="900" height="58" rx="3" fill="#FFFFFF" stroke="#E3DEEA"></rect><rect x="30" y="330" width="3" height="58" fill="#B8952E"></rect><text x="52" y="352" font-size="13.5" fill="#1F1A26">Independently verify account details before making any payment. Banks now display the payee</text><text x="52" y="370" font-size="13.5" fill="#1F1A26">account name before confirmation - use it.</text><rect x="30" y="396" width="900" height="58" rx="3" fill="#FFFFFF" stroke="#E3DEEA"></rect><rect x="30" y="396" width="3" height="58" fill="#B8952E"></rect><text x="52" y="418" font-size="13.5" fill="#1F1A26">Set a value threshold above which you telephone the payee on a number you already hold, never</text><text x="52" y="436" font-size="13.5" fill="#1F1A26">one taken from the email.</text><rect x="30" y="462" width="900" height="40" rx="3" fill="#FFFFFF" stroke="#E3DEEA"></rect><rect x="30" y="462" width="3" height="40" fill="#B8952E"></rect><text x="52" y="484" font-size="13.5" fill="#1F1A26">Require secondary verification of any change to payment instructions.</text><rect x="30" y="510" width="900" height="40" rx="3" fill="#FFFFFF" stroke="#E3DEEA"></rect><rect x="30" y="510" width="3" height="40" fill="#B8952E"></rect><text x="52" y="532" font-size="13.5" fill="#1F1A26">Use dual authorisation for EFTs.</text></svg>