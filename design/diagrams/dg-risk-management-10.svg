<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 580" role="img" style="display:block;width:100%;height:auto;font-family:'Source Sans 3',system-ui,sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#4B2A85"></path></marker></defs>
<text x="30" y="26" font-size="12.5" letter-spacing="1.6" fill="#6B6478">RISK MANAGEMENT · SECTION 9.2</text><line x1="30" y1="40" x2="930" y2="40" stroke="#B8952E" stroke-width="1"></line>
<text x="30" y="76" font-size="11.5" letter-spacing="1.2" fill="#6B6478">DESCRIPTION</text><text x="686" y="76" font-size="11.5" letter-spacing="1.2" fill="#6B6478">YOUR PRACTICE</text><rect x="30" y="88" width="640" height="116" rx="3" fill="#FFFFFF" stroke="#E3DEEA"></rect><text x="48" y="116" font-size="16" fill="#4B2A85" font-weight="700">Vision</text><text x="48" y="140" font-size="13" fill="#1F1A26">What the organisation wishes to be like in some years’ time. Well</text><text x="48" y="158" font-size="13" fill="#1F1A26">conceived, it defines the aspirations of where a business wants to</text><text x="48" y="176" font-size="13" fill="#1F1A26">be, is simple and memorable, and is an overarching statement</text><text x="48" y="194" font-size="13" fill="#1F1A26">closely tied to values and goals</text><g data-fill-cell="vision" data-fill-label="Vision — your practice" role="button" tabindex="0"><rect id="dg-risk-management-10-cell-vision" x="686" y="88" width="244" height="116" rx="3" fill="#FFF9E8" stroke="#E6CF8B" stroke-dasharray="4 4"></rect><text class="fill-placeholder" x="702" y="112" font-size="11" letter-spacing="1.1" fill="#6B6478">YOUR NOTE</text></g><rect x="30" y="214" width="640" height="86" rx="3" fill="#F4F1F8" stroke="#E3DEEA"></rect><text x="48" y="242" font-size="16" fill="#4B2A85" font-weight="700">Mission</text><text x="48" y="266" font-size="13" fill="#1F1A26">The steps to reach the goal. How it will be done. This may be to</text><text x="48" y="284" font-size="13" fill="#1F1A26">maintain the status quo</text><g data-fill-cell="mission" data-fill-label="Mission — your practice" role="button" tabindex="0"><rect id="dg-risk-management-10-cell-mission" x="686" y="214" width="244" height="86" rx="3" fill="#FFF9E8" stroke="#E6CF8B" stroke-dasharray="4 4"></rect><text class="fill-placeholder" x="702" y="238" font-size="11" letter-spacing="1.1" fill="#6B6478">YOUR NOTE</text></g><rect x="30" y="310" width="640" height="98" rx="3" fill="#FFFFFF" stroke="#E3DEEA"></rect><text x="48" y="338" font-size="16" fill="#4B2A85" font-weight="700">Values</text><text x="48" y="362" font-size="13" fill="#1F1A26">Articulated as a list of principles. Describes the desired</text><text x="48" y="380" font-size="13" fill="#1F1A26">culture. A behavioural compass for all staff. Published values</text><text x="48" y="398" font-size="13" fill="#1F1A26">also say something to clients</text><g data-fill-cell="values" data-fill-label="Values — your practice" role="button" tabindex="0"><rect id="dg-risk-management-10-cell-values" x="686" y="310" width="244" height="98" rx="3" fill="#FFF9E8" stroke="#E6CF8B" stroke-dasharray="4 4"></rect><text class="fill-placeholder" x="702" y="334" font-size="11" letter-spacing="1.1" fill="#6B6478">YOUR NOTE</text></g><rect x="30" y="418" width="640" height="86" rx="3" fill="#F4F1F8" stroke="#E3DEEA"></rect><text x="48" y="446" font-size="16" fill="#4B2A85" font-weight="700">Goals</text><text x="48" y="470" font-size="13" fill="#1F1A26">Relates to strategy and vision. Where the firm wants to be, what</text><text x="48" y="488" font-size="13" fill="#1F1A26">it is aiming to achieve</text><g data-fill-cell="goals" data-fill-label="Goals — your practice" role="button" tabindex="0"><rect id="dg-risk-management-10-cell-goals" x="686" y="418" width="244" height="86" rx="3" fill="#FFF9E8" stroke="#E6CF8B" stroke-dasharray="4 4"></rect><text class="fill-placeholder" x="702" y="442" font-size="11" letter-spacing="1.1" fill="#6B6478">YOUR NOTE</text></g><text x="30" y="538" font-size="13" fill="#6B6478">Document and review annually, ideally away from the office. Click a cell to add your own entry.</text></svg>