<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 546" role="img" style="display:block;width:100%;height:auto;font-family:'Source Sans 3',system-ui,sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#4B2A85"></path></marker></defs>
<text x="30" y="26" font-size="12.5" letter-spacing="1.6" fill="#6B6478">TRUST ACCOUNTING · SECTIONS 7.1 AND 7.6 · LEGAL ACCOUNTING HANDBOOK § 6.2</text><line x1="30" y1="40" x2="930" y2="40" stroke="#B8952E" stroke-width="1"></line>
<g data-hover="data-hover"><g><rect x="30" y="70" width="900" height="74" rx="4" fill="#FFFFFF" stroke="#4B2A85" stroke-width="1.3"></rect><text x="52" y="102" font-size="16" font-weight="700" fill="#4B2A85">Source records</text><text x="52" y="126" font-size="13.5" fill="#1F1A26">receipts, cheque butts, EFT authorisations, deposit slips, ADI statements</text></g><line x1="480" y1="144" x2="480" y2="166" stroke="#4B2A85" marker-end="url(#a)"></line><g><rect x="30" y="166" width="900" height="74" rx="4" fill="#FFFFFF" stroke="#4B2A85" stroke-width="1.3"></rect><text x="52" y="198" font-size="16" font-weight="700" fill="#4B2A85">Books of prime entry</text><text x="52" y="222" font-size="13.5" fill="#1F1A26">receipts cash book, payments cash book, transfer journal</text></g><line x1="480" y1="240" x2="480" y2="262" stroke="#4B2A85" marker-end="url(#a)"></line><g><rect x="30" y="262" width="900" height="74" rx="4" fill="#FFFFFF" stroke="#4B2A85" stroke-width="1.3"></rect><text x="52" y="294" font-size="16" font-weight="700" fill="#4B2A85">Book of summary</text><text x="52" y="318" font-size="13.5" fill="#1F1A26">trust ledger accounts</text></g><line x1="480" y1="336" x2="480" y2="358" stroke="#4B2A85" marker-end="url(#a)"></line><g><rect x="30" y="358" width="900" height="74" rx="4" fill="#EAE3F4" stroke="#4B2A85" stroke-width="1.3"></rect><text x="52" y="390" font-size="16" font-weight="700" fill="#4B2A85">Reports</text><text x="52" y="414" font-size="13.5" fill="#1F1A26">reconciliation, trial balance</text></g></g><line x1="30" y1="446" x2="930" y2="446" stroke="#B8952E"></line><text x="30" y="472" font-size="13.5" fill="#1F1A26" font-weight="600">Trust records must be kept in permanent form, in a way that at all times discloses the true position for each person,</text><text x="30" y="490" font-size="13.5" fill="#1F1A26" font-weight="600">and for 7 years after the last transaction entry or finalisation of the matter, whichever is later (s 147).</text><text x="30" y="518" font-size="12.5" fill="#6B6478">Layer names: Law Society of NSW, Legal Accounting Handbook: Trust Money and Trust Records, 9th ed (March 2024) § 6.2.</text></svg>