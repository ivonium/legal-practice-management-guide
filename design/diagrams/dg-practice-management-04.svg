<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" role="img" style="display:block;width:100%;height:auto;font-family:'Source Sans 3',system-ui,sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#4B2A85"></path></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#B8952E"></path></marker></defs>
<text x="30" y="26" font-size="12.5" letter-spacing="1.6" fill="#6B6478">PRACTICE MANAGEMENT · SECTION 1.6</text><line x1="30" y1="40" x2="930" y2="40" stroke="#B8952E" stroke-width="1"></line>
<rect x="30" y="70" width="400" height="250" rx="4" fill="#FFFFFF" stroke="#E3DEEA"></rect><text x="50" y="102" font-size="15" fill="#4B2A85" font-weight="700">Five fee earners over two principals</text><rect x="50" y="126" width="30" height="44" rx="3" fill="#EAE3F4" stroke="#4B2A85"></rect><rect x="88" y="126" width="30" height="44" rx="3" fill="#EAE3F4" stroke="#4B2A85"></rect><rect x="126" y="126" width="30" height="44" rx="3" fill="#EAE3F4" stroke="#4B2A85"></rect><rect x="164" y="126" width="30" height="44" rx="3" fill="#EAE3F4" stroke="#4B2A85"></rect><rect x="202" y="126" width="30" height="44" rx="3" fill="#EAE3F4" stroke="#4B2A85"></rect><text x="50" y="190" font-size="12" fill="#6B6478">fee earners</text><rect x="50" y="206" width="30" height="44" rx="3" fill="#4B2A85"></rect><rect x="88" y="206" width="30" height="44" rx="3" fill="#4B2A85"></rect><text x="50" y="270" font-size="12" fill="#6B6478">principals</text><text x="50" y="302" font-size="17" font-weight="700" fill="#1F1A26">leverage of 2.5</text><line x1="446" y1="195" x2="514" y2="195" stroke="#B8952E" stroke-width="1.6" marker-end="url(#ag)"></line><text x="452" y="184" font-size="12" font-weight="700" fill="#B8952E">promote one</text><rect x="530" y="70" width="400" height="250" rx="4" fill="#FFFFFF" stroke="#E3DEEA"></rect><text x="550" y="102" font-size="15" fill="#4B2A85" font-weight="700">Four fee earners over three principals</text><rect x="550" y="126" width="30" height="44" rx="3" fill="#EAE3F4" stroke="#4B2A85"></rect><rect x="588" y="126" width="30" height="44" rx="3" fill="#EAE3F4" stroke="#4B2A85"></rect><rect x="626" y="126" width="30" height="44" rx="3" fill="#EAE3F4" stroke="#4B2A85"></rect><rect x="664" y="126" width="30" height="44" rx="3" fill="#EAE3F4" stroke="#4B2A85"></rect><text x="550" y="190" font-size="12" fill="#6B6478">fee earners</text><rect x="550" y="206" width="30" height="44" rx="3" fill="#4B2A85"></rect><rect x="588" y="206" width="30" height="44" rx="3" fill="#4B2A85"></rect><rect x="626" y="206" width="30" height="44" rx="3" fill="#4B2A85"></rect><text x="550" y="270" font-size="12" fill="#6B6478">principals</text><text x="550" y="302" font-size="17" font-weight="700" fill="#1F1A26">leverage of 1.33</text><text x="30" y="356" font-size="14" fill="#1F1A26" font-weight="600">Leverage swings wildly when the denominator changes. This is precisely why promotion to equity in small firms is hard:</text><text x="30" y="375" font-size="14" fill="#1F1A26" font-weight="600">it adds a mouth to a trough that has not grown.</text></svg>